      { zh: "如果有的话当然更好，谢谢。", pinyin: "rú guǒ yǒu de huà dāng rán gèng hǎo, xiè xie.", vi: "Nếu có thì đương nhiên tốt hơn, cảm ơn." },
      { zh: "您对社保和公积金有要求吗？", pinyin: "nín duì shè bǎo hé gōng jī jīn yǒu yāo qiú ma?", vi: "Anh/chị có yêu cầu về bảo hiểm xã hội và quỹ tích lũy không?" },
      { zh: "希望按国家规定正常缴纳。", pinyin: "xī wàng àn guó jiā guī dìng zhèng cháng jiǎo nà.", vi: "Hy vọng đóng theo quy định nhà nước bình thường." },
      { zh: "薪资结构您更看重基本工资吗？", pinyin: "xīn zī jié gòu nín gèng kàn zhòng jī běn gōng zī ma?", vi: "Cấu trúc lương anh/chị coi trọng lương cơ bản hơn không?" },
      { zh: "基本工资和绩效最好都合理。", pinyin: "jī běn gōng zī hé jì xiào zuì hǎo dōu hé lǐ.", vi: "Lương cơ bản và hiệu suất tốt nhất đều hợp lý." },

      // 7
      { zh: "请问这个岗位的主要职责是什么？", pinyin: "qǐng wèn zhè ge gǎng wèi de zhǔ yào zhí zé shì shén me?", vi: "Xin hỏi trách nhiệm chính của vị trí này là gì?" },
      { zh: "负责设备调试、维护和故障处理。", pinyin: "fù zé shè bèi tiáo shì, wéi hù hé gù zhàng chǔ lǐ.", vi: "Phụ trách chạy thử, bảo trì thiết bị và xử lý sự cố." },
      { zh: "这个岗位需要经常加班吗？", pinyin: "zhè ge gǎng wèi xū yào jīng cháng jiā bān ma?", vi: "Vị trí này có cần thường xuyên tăng ca không?" },
      { zh: "项目紧张时会有加班，平时正常。", pinyin: "xiàng mù jǐn zhāng shí huì yǒu jiā bān, píng shí zhèng cháng.", vi: "Khi dự án căng thẳng sẽ có tăng ca, bình thường thì bình thường." },
      { zh: "团队目前大概有多少人呢？", pinyin: "tuán duì mù qián dà gài yǒu duō shao rén ne?", vi: "Nhóm hiện khoảng có bao nhiêu người?" },
      { zh: "技术团队目前大概十几个人。", pinyin: "jì shù tuán duì mù qián dà gài shí jǐ gè rén.", vi: "Nhóm kỹ thuật hiện khoảng hơn mười người." },
      { zh: "新人入职后有培训安排吗？", pinyin: "xīn rén rù zhí hòu yǒu péi xùn ān pái ma?", vi: "Người mới nhận việc sau đó có sắp xếp đào tạo không?" },
      { zh: "有，会有带教师傅和系统培训。", pinyin: "yǒu, huì yǒu dài jiào shī fu hé xì tǒng péi xùn.", vi: "Có, sẽ có sư phụ kèm cặp và đào tạo hệ thống." },
      { zh: "这个岗位的晋升空间怎么样？", pinyin: "zhè ge gǎng wèi de jìn shēng kōng jiān zěn me yàng?", vi: "Không gian thăng tiến của vị trí này thế nào?" },
      { zh: "表现好可以从技术员升到主管。", pinyin: "biǎo xiàn hǎo kě yǐ cóng jì shù yuán shēng dào zhǔ guǎn.", vi: "Thể hiện tốt có thể từ kỹ thuật viên lên chủ quản." },
      { zh: "公司对员工的培训重视吗？", pinyin: "gōng sī duì yuán gōng de péi xùn zhòng shì ma?", vi: "Công ty có coi trọng đào tạo nhân viên không?" },
      { zh: "很重视，每年都有外部培训机会。", pinyin: "hěn zhòng shì, měi nián dōu yǒu wài bù péi xùn jī huì.", vi: "Rất coi trọng, mỗi năm đều có cơ hội đào tạo bên ngoài." },
      { zh: "入职后大概多久能独立上岗？", pinyin: "rù zhí hòu dà gài duō jiǔ néng dú lì shàng gǎng?", vi: "Sau nhận việc khoảng bao lâu có thể độc lập làm việc?" },
      { zh: "一般一到三个月可以独立上岗。", pinyin: "yī bān yī dào sān gè yuè kě yǐ dú lì shàng gǎng.", vi: "Thường một đến ba tháng có thể độc lập làm việc." },
      { zh: "这个岗位需要出差到客户现场吗？", pinyin: "zhè ge gǎng wèi xū yào chū chāi dào kè hù xiàn chǎng ma?", vi: "Vị trí này có cần đi công tác đến hiện trường khách hàng không?" },
      { zh: "有时需要，根据项目情况安排。", pinyin: "yǒu shí xū yào, gēn jù xiàng mù qíng kuàng ān pái.", vi: "Đôi khi cần, sắp xếp theo tình hình dự án." },
      { zh: "公司的企业文化大概是怎样的？", pinyin: "gōng sī de qǐ yè wén huà dà gài shì zěn yàng de?", vi: "Văn hóa doanh nghiệp của công ty khoảng thế nào?" },
      { zh: "注重务实、创新和团队合作。", pinyin: "qiáng diào wù shí, chuàng xīn hé tuán duì hé zuò.", vi: "Nhấn mạnh thiết thực, sáng tạo và hợp tác nhóm." },
      { zh: "我还有什么需要准备的吗？", pinyin: "wǒ hái yǒu shén me xū yào zhǔn bèi de ma?", vi: "Tôi còn gì cần chuẩn bị không?" },
      { zh: "先熟悉一下我们的产品和工艺。", pinyin: "xiān shóu xī yī xià wǒ men de chǎn pǐn hé gōng yì.", vi: "Trước làm quen một chút với sản phẩm và quy trình của chúng tôi." },

      // 8
      { zh: "如果设备突然故障，您会怎么做？", pinyin: "rú guǒ shè bèi tū rán gù zhàng, nín huì zěn me zuò?", vi: "Nếu thiết bị đột ngột sự cố, anh/chị sẽ làm gì?" },
      { zh: "先确保安全，再排查并及时报告。", pinyin: "xiān què bǎo ān quán, zài pái chá bìng jí shí bào gào.", vi: "Trước đảm bảo an toàn, rồi kiểm tra và báo cáo kịp thời." },
      { zh: "和同事意见不一致时怎么处理？", pinyin: "hé tóng shì yì jiàn bù yī zhì shí zěn me chǔ lǐ?", vi: "Khi ý kiến với đồng nghiệp không thống nhất xử lý thế nào?" },
      { zh: "先沟通清楚，以事实和标准为准。", pinyin: "xiān gōu tōng qīng chu, yǐ shì shí hé biāo zhǔn wéi zhǔn.", vi: "Trước giao tiếp rõ ràng, lấy sự thật và tiêu chuẩn làm chuẩn." },
      { zh: "任务太多做不完的时候怎么办？", pinyin: "rèn wù tài duō zuò bù wán de shí hou zěn me bàn?", vi: "Khi nhiệm vụ quá nhiều làm không xong thì sao?" },
      { zh: "分清优先级，必要时向领导汇报。", pinyin: "fēn qīng yōu xiān jí, bì yào shí xiàng lǐng dǎo huì bào.", vi: "Phân biệt mức ưu tiên, cần thiết thì báo cáo lãnh đạo." },
      { zh: "发现同事违规操作您会怎样？", pinyin: "fā xiàn tóng shì wéi guī cāo zuò nín huì zěn yàng?", vi: "Phát hiện đồng nghiệp thao tác vi phạm anh/chị sẽ thế nào?" },
      { zh: "及时提醒，严重的向上级报告。", pinyin: "jí shí tí xǐng, yán zhòng de xiàng shàng jí bào gào.", vi: "Nhắc nhở kịp thời, nghiêm trọng thì báo cấp trên." },
      { zh: "如果被领导公开批评您怎么反应？", pinyin: "rú guǒ bèi lǐng dǎo gōng kāi pī píng nín zěn me fǎn yìng?", vi: "Nếu bị lãnh đạo phê bình công khai anh/chị phản ứng thế nào?" },
      { zh: "虚心接受，事后认真改正错误。", pinyin: "xū xīn jiē shòu, shì hòu rèn zhēn gǎi zhèng cuò wù.", vi: "Khiêm tốn tiếp nhận, sau đó nghiêm túc sửa sai." },
      { zh: "遇到技术难题卡住了怎么办？", pinyin: "yù dào jì shù nán tí kǎ zhù le zěn me bàn?", vi: "Gặp khó khăn kỹ thuật bị kẹt thì làm sao?" },
      { zh: "查资料、请教同事，必要时求助。", pinyin: "chá zī liào, qǐng jiào tóng shì, bì yào shí qiú zhù.", vi: "Tra tài liệu, hỏi đồng nghiệp, cần thiết thì cầu cứu." },
      { zh: "您如何保证自己的工作质量？", pinyin: "nín rú hé bǎo zhèng zì jǐ de gōng zuò zhì liàng?", vi: "Anh/chị làm sao đảm bảo chất lượng công việc của mình?" },
      { zh: "按标准操作，自检后再交付。", pinyin: "àn biāo zhǔn cāo zuò, zì jiǎn hòu zài jiāo fù.", vi: "Thao tác theo tiêu chuẩn, tự kiểm rồi mới bàn giao." },
      { zh: "客户投诉到您这里您怎么应对？", pinyin: "kè hù tóu sù dào nín zhè lǐ nín zěn me yìng duì?", vi: "Khách hàng khiếu nại đến anh/chị thì đối phó thế nào?" },
      { zh: "耐心倾听，尽快解决并跟进结果。", pinyin: "nài xīn qīng tīng, jǐn kuài jiě jué bìng gēn jìn jié guǒ.", vi: "Kiên nhẫn lắng nghe, giải quyết sớm và theo dõi kết quả." },
      { zh: "同事推卸责任时您怎么处理？", pinyin: "tóng shì tuī xiè zé rèn shí nín zěn me chǔ lǐ?", vi: "Khi đồng nghiệp đổ trách nhiệm anh/chị xử lý thế nào?" },
      { zh: "先把事情做好，事后再沟通。", pinyin: "xiān bǎ shì qing zuò hǎo, shì hòu zài gōu tōng.", vi: "Trước làm xong việc, sau việc rồi giao tiếp." },
      { zh: "如果同时接到多个紧急任务呢？", pinyin: "rú guǒ tóng shí jiē dào duō gè jǐn jí rèn wù ne?", vi: "Nếu đồng thời nhận nhiều nhiệm vụ khẩn cấp thì sao?" },
      { zh: "先确认优先级，再合理分配时间。", pinyin: "xiān què rèn yōu xiān jí, zài hé lǐ fēn pèi shí jiān.", vi: "Trước xác nhận mức ưu tiên, rồi phân bổ thời gian hợp lý." },

      // 9
      { zh: "今天的面试就先到这里吧。", pinyin: "jīn tiān de miàn shì jiù xiān dào zhè lǐ ba.", vi: "Phỏng vấn hôm nay tạm đến đây thôi." },
      { zh: "非常感谢您抽出时间来面试。", pinyin: "fēi cháng gǎn xiè nín chōu chū shí jiān lái miàn shì.", vi: "Rất cảm ơn anh/chị đã dành thời gian đến phỏng vấn." },
      { zh: "我们会在一周内通知您结果。", pinyin: "wǒ men huì zài yī zhōu nèi tōng zhī nín jié guǒ.", vi: "Chúng tôi sẽ thông báo kết quả cho anh/chị trong một tuần." },
      { zh: "好的，我很期待您的消息呢。", pinyin: "hǎo de, wǒ hěn qī dài nín de xiāo xi. ne", vi: "Được, tôi rất mong tin từ anh/chị." },
      { zh: "您还有什么要补充的内容吗？", pinyin: "nín hái yǒu shén me yào bǔ chōng de nèi róng ma?", vi: "Anh/chị còn nội dung gì muốn bổ sung không?" },
      { zh: "没有了，再次感谢您的时间。", pinyin: "méi yǒu le, zài cì gǎn xiè nín de shí jiān.", vi: "Không còn, lần nữa cảm ơn thời gian của anh/chị." },
      { zh: "请问大概什么时候能知道结果？", pinyin: "qǐng wèn dà gài shén me shí hou néng zhī dào jié guǒ?", vi: "Xin hỏi khoảng khi nào có thể biết kết quả?" },
      { zh: "最快三到五个工作日会通知。", pinyin: "zuì kuài sān dào wǔ gè gōng zuò rì huì tōng zhī.", vi: "Nhanh nhất ba đến năm ngày làm việc sẽ thông báo." },
      { zh: "如果有消息，我们会电话通知。", pinyin: "rú guǒ yǒu xiāo xi, wǒ men huì diàn huà tōng zhī.", vi: "Nếu có tin, chúng tôi sẽ gọi điện thông báo." },
      { zh: "好的，我会保持电话畅通的。", pinyin: "hǎo de, wǒ huì bǎo chí diàn huà chàng tōng de.", vi: "Được, tôi sẽ giữ điện thoại thông suốt." },
      { zh: "祝您今天一切都顺利一下。", pinyin: "zhù nín jīn tiān yī qiè dōu shùn lì. yī xià", vi: "Chúc anh/chị hôm nay mọi thứ đều suôn sẻ." },
      { zh: "也祝您工作顺利，身体健康。", pinyin: "yě zhù nín gōng zuò shùn lì, shēn tǐ jiàn kāng.", vi: "Cũng chúc anh/chị công việc suôn sẻ, sức khỏe tốt." },
      { zh: "请慢走，路上注意安全一下。", pinyin: "qǐng màn zǒu, lù shàng zhù yì ān quán. yī xià", vi: "Xin đi cẩn thận, trên đường chú ý an toàn." },
      { zh: "谢谢，再见，有机会再联系呢。", pinyin: "xiè xie, zài jiàn, yǒu jī huì zài lián xì. ne", vi: "Cảm ơn, tạm biệt, có cơ hội liên hệ lại." },
      { zh: "很高兴今天能认识您一下。", pinyin: "hěn gāo xìng jīn tiān néng rèn shi nín. yī xià", vi: "Rất vui hôm nay được làm quen với anh/chị." },
      { zh: "同样高兴，希望有机会合作。", pinyin: "tóng yàng gāo xìng, xī wàng yǒu jī huì hé zuò.", vi: "Cũng vui như vậy, hy vọng có cơ hội hợp tác." },
      { zh: "再次感谢您宝贵的时间呢。", pinyin: "zài cì gǎn xiè nín bǎo guì de shí jiān. ne", vi: "Một lần nữa cảm ơn thời gian quý báu của anh/chị." },
      { zh: "不客气，路上小心一点一下。", pinyin: "bú kè qi, lù shàng xiǎo xīn yī diǎn. yī xià", vi: "Không có gì, đi đường cẩn thận một chút." },
      { zh: "如果录用，我什么时候可以入职？", pinyin: "rú guǒ lù yòng, wǒ shén me shí hou kě yǐ rù zhí?", vi: "Nếu được nhận, tôi khi nào có thể nhận việc?" },
      { zh: "如果录用，一个月内可以入职。", pinyin: "rú guǒ lù yòng, yī gè yuè nèi kě yǐ rù zhí.", vi: "Nếu được nhận, trong một tháng có thể nhận việc." },

      { zh: "如果设备突然故障您会怎么做？", pinyin: "rú guǒ shè bèi tū rán gù zhàng nín huì zěn me zuò?", vi: "Nếu thiết bị đột ngột sự cố anh/chị sẽ làm gì?" },

      { zh: "请问这个岗位的主要职责是什么？", pinyin: "qǐng wèn zhè ge gǎng wèi de zhǔ yào zhí zé shì shén me?", vi: "Xin hỏi trách nhiệm chính của vị trí này là gì?" },
      { zh: "负责设备调试、维护和故障处理。", pinyin: "fù zé shè bèi tiáo shì, wéi hù hé gù zhàng chǔ lǐ.", vi: "Phụ trách chạy thử, bảo trì thiết bị và xử lý sự cố." },
      { zh: "您什么时候可以办理入职手续？", pinyin: "nín shén me shí hou kě yǐ bàn lǐ rù zhí shǒu xù?", vi: "Anh/chị khi nào có thể làm thủ tục nhận việc?" },
      { zh: "如果录用，一个月内可以入职。", pinyin: "rú guǒ lù yòng, yī gè yuè nèi kě yǐ rù zhí.", vi: "Nếu được nhận, trong một tháng có thể nhận việc." },
      { zh: "我们会在一周内通知您结果。", pinyin: "wǒ men huì zài yī zhōu nèi tōng zhī nín jié guǒ.", vi: "Chúng tôi sẽ thông báo kết quả cho anh/chị trong một tuần." },
      { zh: "好的，我期待您的消息，谢谢。", pinyin: "hǎo de, wǒ qī dài nín de xiāo xi, xiè xie.", vi: "Được, tôi mong tin từ anh/chị, cảm ơn." },
      { zh: "压力大的时候，我先冷静再解决。", pinyin: "yā lì dà de shí hou, wǒ xiān lěng jìng zài jiě jué.", vi: "Khi áp lực lớn, tôi trước bình tĩnh rồi giải quyết." },
      { zh: "我学习能力较强，能快速掌握新技术。", pinyin: "wǒ xué xí néng lì jiào qiáng, néng kuài sù zhǎng wò xīn jì shù.", vi: "Khả năng học của tôi khá mạnh, có thể nắm nhanh công nghệ mới." },
      { zh: "很高兴有机会面试，谢谢您的时间。", pinyin: "hěn gāo xìng yǒu jī huì miàn shì, xiè xie nín de shí jiān.", vi: "Rất vui có cơ hội phỏng vấn, cảm ơn thời gian của anh/chị." },
      { zh: "再见，祝您工作顺利，希望合作。", pinyin: "zài jiàn, zhù nín gōng zuò shùn lì, xī wàng hé zuò.", vi: "Tạm biệt, chúc anh/chị công việc suôn sẻ, hy vọng hợp tác." }
    ]
  }
    };

    // ===== STATE =====
    let currentModule = null;
    let currentIndex = 0;
    let currentSection = 0;
    const SECTION_SIZE = 20;
    let sections = [];
    let sentences = [];
    let TOTAL = 0;
    let unlockMode = null; // "full" | "trial"

    // ===== DEVICE ID =====
    function getDeviceId() {
      let id = localStorage.getItem("giao_tiep_device_id");
      if (!id) {
        id = "DEV-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem("giao_tiep_device_id", id);
      }
      return id;
    }

    // ===== KEY LOGIC (Cloudflare Worker) =====
    async function checkKey() {
      const errEl = document.getElementById("loginError");
      const input = document.getElementById("keyInput").value.trim().toUpperCase();
      if (!input) {
        errEl.textContent = "Vui lòng nhập key.";
        errEl.style.display = "block";
        return;
      }

      errEl.style.display = "none";
      const btn = document.querySelector("#loginScreen button");
      const oldText = btn.textContent;
      btn.textContent = "Đang kiểm tra...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: input, deviceId: getDeviceId() })
        });
        const data = await res.json();

        if (data.ok) {
          unlockMode = data.mode || "full";
          localStorage.setItem("giao_tiep_unlocked", unlockMode);
          localStorage.setItem("giao_tiep_key", input);
          showLevelScreen();
        } else {
          errEl.textContent = data.message || "Key không hợp lệ.";
          errEl.style.display = "block";
        }
      } catch (e) {
        errEl.textContent = "Không kết nối được server. Thử lại sau.";
        errEl.style.display = "block";
      } finally {
        btn.textContent = oldText;
        btn.disabled = false;
      }
    }

    function logout() {
      localStorage.removeItem("giao_tiep_unlocked");
      localStorage.removeItem("giao_tiep_key");
      unlockMode = null;
      document.getElementById("levelScreen").style.display = "none";
      document.getElementById("practiceScreen").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("keyInput").value = "";
      document.getElementById("loginError").style.display = "none";
    }

    // Auto unlock if remembered (vẫn cần xác thực lại với server lần đầu mở)
    (async function() {
      const saved = localStorage.getItem("giao_tiep_unlocked");
      const savedKey = localStorage.getItem("giao_tiep_key");
      if (saved && savedKey) {
        try {
          const res = await fetch(API_URL + "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ key: savedKey, deviceId: getDeviceId() })
          });
          const data = await res.json();
          if (data.ok) {
            unlockMode = data.mode || "full";
            showLevelScreen();
            return;
          }
        } catch (e) {}
        // Nếu server từ chối → xóa và hiện login
        localStorage.removeItem("giao_tiep_unlocked");
        localStorage.removeItem("giao_tiep_key");
      }
    })();

    function showLevelScreen() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("practiceScreen").style.display = "none";
      document.getElementById("levelScreen").style.display = "block";

      const list = document.getElementById("levelList");
      list.innerHTML = "";

      if (unlockMode === "trial") {
        const banner = document.createElement("div");
        banner.className = "trial-banner";
        banner.innerHTML = "🧪 Bản dùng thử — Chỉ 3 chủ đề cơ bản (HSK1, HSK2, Cuộc sống phần 1)";
        list.appendChild(banner);
      }

      const allowed = unlockMode === "full" ? Object.keys(MODULES) : TRIAL_MODULES;
      allowed.forEach(key => {
        if (!MODULES[key]) return;
        const m = MODULES[key];
        const btn = document.createElement("button");
        btn.className = "level-btn";
        btn.innerHTML = m.title + ' <span class="count">200 câu</span>';
        btn.onclick = () => startModule(key);
        list.appendChild(btn);
      });
    }

    function startModule(key) {
      currentModule = key;
      const m = MODULES[key];
      sections = JSON.parse(JSON.stringify(m.sections)); // deep copy
      sentences = JSON.parse(JSON.stringify(m.sentences));
      TOTAL = sentences.length;
      currentIndex = 0;
      currentSection = 0;
      shuffleSections();
      document.getElementById("practiceTitle").textContent = m.title;
      document.getElementById("levelScreen").style.display = "none";
      document.getElementById("practiceScreen").style.display = "block";
      showSentence();
    }

    function backToLevels() {
      if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
      document.getElementById("practiceScreen").style.display = "none";
      document.getElementById("levelScreen").style.display = "block";
    }

    // ===== PRACTICE LOGIC (same as original) =====
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function shuffleSections() {
      for (let s = 0; s < sections.length; s++) {
        const start = sections[s].start;
        const chunk = sentences.slice(start, start + SECTION_SIZE);
        shuffleArray(chunk);
        for (let i = 0; i < SECTION_SIZE; i++) sentences[start + i] = chunk[i];
      }
    }

    function getSectionIndex(idx) {
      for (let i = sections.length - 1; i >= 0; i--) {
        if (idx >= sections[i].start) return i;
      }
      return 0;
    }

    function updateNav() {
      const nav = document.getElementById("navSections");
      nav.innerHTML = "";
      sections.forEach((sec, i) => {
        const btn = document.createElement("button");
        btn.textContent = (i + 1);
        btn.title = sec.name;
        if (i === currentSection) btn.classList.add("active");
        btn.onclick = () => { currentIndex = sec.start; currentSection = i; showSentence(); };
        nav.appendChild(btn);
      });
    }

    function speakChinese() {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        document.getElementById("btnListen").classList.remove("speaking");
        document.getElementById("btnListen").textContent = "🔊 Nghe tiếng Trung";
        return;
      }
      const text = document.getElementById("chinese").textContent;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = 0.8;
      const voices = window.speechSynthesis.getVoices();
      const chineseVoice = voices.find(v => v.lang.startsWith("zh") || v.name.toLowerCase().includes("chinese"));
      if (chineseVoice) utterance.voice = chineseVoice;
      const btn = document.getElementById("btnListen");
      btn.classList.add("speaking");
      btn.textContent = "⏹ Dừng";
      utterance.onend = utterance.onerror = () => {
        btn.classList.remove("speaking");
        btn.textContent = "🔊 Nghe tiếng Trung";
      };
      window.speechSynthesis.speak(utterance);
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function showSentence() {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        document.getElementById("btnListen").classList.remove("speaking");
        document.getElementById("btnListen").textContent = "🔊 Nghe tiếng Trung";
      }
      currentSection = getSectionIndex(currentIndex);
      const s = sentences[currentIndex];
      const localIdx = currentIndex - sections[currentSection].start + 1;
      document.getElementById("chinese").textContent = s.zh;
      document.getElementById("pinyin").textContent = s.pinyin;
      document.getElementById("sectionInfo").textContent = "Phần " + (currentSection + 1) + ": " + sections[currentSection].name;
      document.getElementById("progress").textContent = "Câu " + localIdx + " / 20  (Tổng: " + (currentIndex + 1) + "/" + TOTAL + ")";
      document.getElementById("userInput").value = "";
      document.getElementById("answerBox").classList.remove("show");
      document.getElementById("btnNext").disabled = true;
      document.getElementById("userInput").focus();
      updateNav();
    }

    function checkAnswer() {
      document.getElementById("correctAnswer").textContent = sentences[currentIndex].vi;
      document.getElementById("answerBox").classList.add("show");
      document.getElementById("btnNext").disabled = false;
    }

    function nextSentence() {
      const finishedSection = getSectionIndex(currentIndex);
      const sectionStart = sections[finishedSection].start;
      const isLastInSection = (currentIndex === sectionStart + SECTION_SIZE - 1);

      currentIndex++;

      if (currentIndex >= TOTAL) {
        currentIndex = 0;
        shuffleSections();
        alert("Bạn đã luyện xong " + TOTAL + " câu! Đã xáo lại thứ tự trong từng phần.");
      } else if (isLastInSection) {
        const start = sectionStart;
        const chunk = sentences.slice(start, start + SECTION_SIZE);
        shuffleArray(chunk);
        for (let i = 0; i < SECTION_SIZE; i++) sentences[start + i] = chunk[i];
      }
      showSentence();
    }

    document.getElementById("userInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (document.getElementById("btnNext").disabled) checkAnswer();
        else nextSentence();
      }
    });

    document.getElementById("keyInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") checkKey();
    });
  </script>
</body>
</html>
