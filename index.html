<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện phản xạ giao tiếp hàng ngày</title>
      <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      color: #333;
    }

    /* ===== MÀN HÌNH NHẬP KEY ===== */
    #loginScreen {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      margin-top: 40px;
      border: 1px solid #e2e8f0;
    }
    #loginScreen h1 {
      font-size: 1.45rem;
      color: #1e293b;
      margin-bottom: 8px;
      font-weight: 700;
    }
    #loginScreen .desc {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    #loginScreen input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1.05rem;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
      background: #fff;
    }
    #loginScreen input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    #loginScreen button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #loginScreen button:hover { background: #2563eb; }
    #loginError {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
    }

    /* ===== MÀN HÌNH CHỌN LEVEL ===== */
    #levelScreen {
      display: none;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 520px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      margin-top: 20px;
      border: 1px solid #e2e8f0;
    }
    #levelScreen h1 {
      font-size: 1.35rem;
      color: #1e293b;
      margin-bottom: 6px;
      font-weight: 700;
    }
    #levelScreen .desc {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .level-list {
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .level-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .level-btn:hover {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1e40af;
    }
    .level-btn .count {
      float: right;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
    }
    .btn-logout {
      margin-top: 16px;
      padding: 10px 20px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #64748b;
      cursor: pointer;
    }
    .btn-logout:hover { background: #e2e8f0; }

    /* ===== MÀN HÌNH LUYỆN ===== */
    #practiceScreen {
      display: none;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 640px;
      width: 100%;
      padding: 28px 22px;
      margin-top: 10px;
      border: 1px solid #e2e8f0;
    }
    #practiceScreen h1 {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 4px;
      color: #1e293b;
      font-weight: 700;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .section-info {
      text-align: center;
      font-size: 0.88rem;
      color: #1e40af;
      font-weight: 600;
      margin-bottom: 8px;
      background: #eff6ff;
      padding: 6px 12px;
      border-radius: 20px;
      display: block;
    }
    .progress {
      text-align: center;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 14px;
      font-weight: 500;
    }
    .card {
      background: #f8fafc;
      border-radius: 14px;
      padding: 22px 14px;
      margin-bottom: 18px;
      border: 2px solid #e2e8f0;
    }
    .chinese {
      font-size: 1.3rem;
      text-align: center;
      line-height: 1.45;
      color: #0f172a;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .pinyin {
      text-align: center;
      font-size: 0.88rem;
      color: #3b82f6;
      margin-bottom: 14px;
      font-style: italic;
    }
    .btn-listen {
      display: block;
      margin: 0 auto;
      padding: 8px 18px;
      background: #eff6ff;
      color: #1e40af;
      border: 2px solid #93c5fd;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-listen:hover, .btn-listen.speaking {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .btn-listen.speaking { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.7; } }
    .label {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 8px;
      font-weight: 500;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #3b82f6; }
    .answer-box {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #f0fdf4;
      border-radius: 12px;
      border-left: 4px solid #22c55e;
    }
    .answer-box.show { display: block; }
    .answer-label {
      font-size: 0.78rem;
      color: #15803d;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .answer-text {
      font-size: 1.05rem;
      color: #166534;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-check { background: #3b82f6; color: white; }
    .btn-check:hover { background: #2563eb; }
    .btn-next { background: #10b981; color: white; }
    .btn-next:hover { background: #059669; }
    .btn-next:disabled { background: #cbd5e1; cursor: not-allowed; }
    .nav-sections {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 14px;
    }
    .nav-sections button {
      flex: none;
      padding: 6px 10px;
      font-size: 0.75rem;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      cursor: pointer;
    }
    .nav-sections button.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .hint {
      text-align: center;
      font-size: 0.78rem;
      color: #888;
      margin-top: 14px;
    }
    .btn-back {
      display: block;
      width: 100%;
      margin: 14px 0 0;
      padding: 12px 16px;
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      text-align: center;
    }
    .btn-back:hover { background: #e2e8f0; }
    .btn-back-top {
      display: inline-block;
      margin: 0 0 12px 0;
      padding: 8px 14px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }
    .btn-back-top:hover { background: #e2e8f0; }
    @media (max-width: 480px) {
      #practiceScreen { padding: 20px 14px; }
      .chinese { font-size: 1.15rem; }
      .buttons { flex-direction: column; }
    }
    .trial-banner {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <h1>🔑 Luyện phản xạ giao tiếp hàng ngày</h1>
    <p class="desc">Nhập key để mở khóa<br>
    <span style="font-size:0.85rem;color:#64748b">Mỗi key tối đa 5 thiết bị</span></p>
    <input type="text" id="keyInput" placeholder="Nhập key của bạn..." autocomplete="off" autofocus>
    <button onclick="checkKey()">Mở khóa</button>
    <p id="loginError" style="display:none;color:#ef4444;font-size:0.9rem;margin-top:12px;"></p>
  </div>

  <!-- LEVEL SELECT -->
  <div id="levelScreen">
    <h1>📚 Chọn chủ đề luyện</h1>
    <p class="desc">13 chủ đề · 200 câu mỗi chủ đề</p>
    <div class="level-list" id="levelList"></div>
    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
  </div>

  <!-- PRACTICE -->
  <div id="practiceScreen">
    <button class="btn-back-top" onclick="backToLevels()">← Quay lại chọn chủ đề</button>
    <h1 id="practiceTitle">Luyện phản xạ</h1>
    <p class="subtitle">200 câu · 10 phần × 20 câu</p>
    <div class="nav-sections" id="navSections"></div>
    <div class="section-info" id="sectionInfo">Phần 1</div>
    <div class="progress" id="progress">Câu 1 / 20</div>
    <div class="card">
      <div class="chinese" id="chinese"></div>
      <div class="pinyin" id="pinyin"></div>
      <button class="btn-listen" id="btnListen" onclick="speakChinese()">🔊 Nghe tiếng Trung</button>
    </div>
    <div class="label">Bạn dịch sang tiếng Việt:</div>
    <textarea id="userInput" placeholder="Gõ bản dịch của bạn ở đây..."></textarea>
    <div class="answer-box" id="answerBox">
      <div class="answer-label">Đáp án đúng:</div>
      <div class="answer-text" id="correctAnswer"></div>
    </div>
    <div class="buttons">
      <button class="btn-check" onclick="checkAnswer()">Xem đáp án</button>
      <button class="btn-next" id="btnNext" onclick="nextSentence()" disabled>Câu tiếp →</button>
    </div>
    <p class="hint">Hết 20 câu 1 phần → tự xáo phần đó. Tốc độ đọc: 0.8</p>
    <button class="btn-back" onclick="backToLevels()">← Quay lại danh sách chủ đề</button>
  </div>

  <script>

      { zh: "可以看一下吗？附近有超市吗？", pinyin: "kě yǐ kàn yī xià ma? fù jìn yǒu chāo shì ma?", vi: "Có thể xem một chút không? Gần đây có siêu thị không?" },
      { zh: "有，走五分钟就到。下周一可以搬进。", pinyin: "yǒu, zǒu wǔ fēn zhōng jiù dào. xià zhōu yī kě yǐ bān jìn.", vi: "Có, đi năm phút là đến. Thứ Hai tuần sau có thể chuyển vào." },
      { zh: "请问怎么开银行账户？", pinyin: "qǐng wèn zěn me kāi yín háng zhàng hù?", vi: "Xin hỏi mở tài khoản ngân hàng thế nào?" },
      { zh: "请带上护照和手机，到柜台办理。", pinyin: "qǐng dài shàng hù zhào hé shǒu jī, dào guì tái bàn lǐ.", vi: "Xin mang hộ chiếu và điện thoại, đến quầy làm thủ tục." },
      { zh: "这里网速有点慢，能帮忙检查一下吗？", pinyin: "zhè lǐ wǎng sù yǒu diǎn màn, néng bāng máng jiǎn chá yī xià ma?", vi: "Ở đây tốc độ mạng hơi chậm, giúp kiểm tra một chút được không?" },
      { zh: "好的，我马上处理。", pinyin: "hǎo de, wǒ mǎ shàng chǔ lǐ.", vi: "Được, tôi xử lý ngay." },
      { zh: "一起去健身吧，下午三点怎么样？", pinyin: "yī qǐ qù jiàn shēn ba, xià wǔ sān diǎn zěn me yàng?", vi: "Cùng đi tập gym đi, ba giờ chiều thế nào?" },
      { zh: "可以，我准备好了。", pinyin: "kě yǐ, wǒ zhǔn bèi hǎo le.", vi: "Được, tôi chuẩn bị xong rồi." },
      { zh: "空气不太好，记得戴口罩。", pinyin: "kōng qì bú tài hǎo, jì de dài kǒu zhào.", vi: "Không khí không tốt lắm, nhớ đeo khẩu trang." },
      { zh: "谢谢提醒。垃圾要分类放。", pinyin: "xiè xie tí xǐng. lā jī yào fēn lèi fàng.", vi: "Cảm ơn nhắc nhở. Rác phải phân loại để." },
      { zh: "中国过年北方吃饺子，南方吃年糕。", pinyin: "Zhōng guó guò nián běi fāng chī jiǎo zi, nán fāng chī nián gāo.", vi: "Trung Quốc đón Tết miền Bắc ăn sủi cảo, miền Nam ăn bánh năm." },
      { zh: "很有意思，我下次也试试。", pinyin: "hěn yǒu yì si, wǒ xià cì yě shì shi.", vi: "Rất thú vị, lần sau tôi cũng thử." },
      { zh: "你看今天的新闻了吗？有新政策。", pinyin: "nǐ kàn jīn tiān de xīn wén le ma? yǒu xīn zhèng cè.", vi: "Bạn xem tin hôm nay chưa? Có chính sách mới." },
      { zh: "可能会影响交通，上班早点出门。", pinyin: "kě néng huì yǐng xiǎng jiāo tōng, shàng bān zǎo diǎn chū mén.", vi: "Có thể ảnh hưởng giao thông, đi làm ra sớm hơn." },
      { zh: "谢谢你一直支持我，有困难随时说。", pinyin: "xiè xie nǐ yī zhí zhī chí wǒ, yǒu kùn nán suí shí shuō.", vi: "Cảm ơn bạn luôn ủng hộ tôi, có khó khăn cứ nói." },
      { zh: "朋友就应该互相帮助。保持联系。", pinyin: "péng you jiù yīng gāi hù xiāng bāng zhù. bǎo chí lián xì.", vi: "Bạn bè nên giúp đỡ lẫn nhau. Giữ liên lạc." },
      { zh: "好的，再见！祝你一切顺利。", pinyin: "hǎo de, zài jiàn! zhù nǐ yī qiè shùn lì.", vi: "Được, tạm biệt! Chúc bạn mọi việc suôn sẻ." }
    ]
  },
  "HSK4-1": {
    title: "📕 HSK 4 · Phần 1",
    color: "#4a148c",
    sections: [
      { name: "Công việc & sự nghiệp", start: 0 },
      { name: "Xã hội & quan điểm", start: 20 },
      { name: "Giáo dục & học tập", start: 40 },
      { name: "Kinh tế & tiêu dùng", start: 60 },
      { name: "Môi trường & phát triển", start: 80 },
      { name: "Văn hóa & truyền thống", start: 100 },
      { name: "Sức khỏe & lối sống", start: 120 },
      { name: "Công nghệ & đổi mới", start: 140 },
      { name: "Quan hệ & giao tiếp", start: 160 },
      { name: "Phản xạ tình huống tổng hợp", start: 180 }
    ],
    sentences: [
      // 1. Công việc & sự nghiệp
      { zh: "你对目前的工作满意吗？", pinyin: "nǐ duì mù qián de gōng zuò mǎn yì ma?", vi: "Bạn có hài lòng với công việc hiện tại không?" },
      { zh: "总体上还可以，但挑战也不少。", pinyin: "zǒng tǐ shàng hái kě yǐ, dàn tiǎo zhàn yě bù shǎo.", vi: "Tổng thể ổn, nhưng thách thức cũng không ít." },
      { zh: "你为什么想换工作？", pinyin: "nǐ wèi shén me xiǎng huàn gōng zuò?", vi: "Tại sao bạn muốn đổi việc?" },
      { zh: "希望有更大的发展空间。", pinyin: "xī wàng yǒu gèng dà de fā zhǎn kōng jiān.", vi: "Hy vọng có không gian phát triển lớn hơn." },
      { zh: "面试时最重要的是什么？", pinyin: "miàn shì shí zuì zhòng yào de shì shén me?", vi: "Khi phỏng vấn điều quan trọng nhất là gì?" },
      { zh: "诚实和自信都很关键。", pinyin: "chéng shí hé zì xìn dōu hěn guān jiàn.", vi: "Thành thật và tự tin đều rất quan trọng." },
      { zh: "这份工作需要经常出差吗？", pinyin: "zhè fèn gōng zuò xū yào jīng cháng chū chāi ma?", vi: "Công việc này có cần thường xuyên đi công tác không?" },
      { zh: "有时候需要，但可以提前安排。", pinyin: "yǒu shí hou xū yào, dàn kě yǐ tí qián ān pái.", vi: "Đôi khi cần, nhưng có thể sắp xếp trước." },
      { zh: "团队协作对你来说重要吗？", pinyin: "tuán duì xié zuò duì nǐ lái shuō zhòng yào ma?", vi: "Hợp tác nhóm đối với bạn có quan trọng không?" },
      { zh: "非常重要，一个人很难完成复杂任务。", pinyin: "fēi cháng zhòng yào, yī gè rén hěn nán wán chéng fù zá rèn wù.", vi: "Rất quan trọng, một mình khó hoàn thành nhiệm vụ phức tạp." },
      { zh: "你如何平衡工作和生活？", pinyin: "nǐ rú hé píng héng gōng zuò hé shēng huó?", vi: "Bạn cân bằng công việc và cuộc sống thế nào?" },
      { zh: "尽量按时下班，周末不看工作邮件。", pinyin: "jǐn liàng àn shí xià bān, zhōu mò bú kàn gōng zuò yóu jiàn.", vi: "Cố tan làm đúng giờ, cuối tuần không xem email công việc." },
      { zh: "领导对你的表现评价如何？", pinyin: "lǐng dǎo duì nǐ de biǎo xiàn píng jià rú hé?", vi: "Lãnh đạo đánh giá biểu hiện của bạn thế nào?" },
      { zh: "比较认可，但也提出了改进建议。", pinyin: "bǐ jiào rèn kě, dàn yě tí chū le gǎi jìn jiàn yì.", vi: "Khá công nhận, nhưng cũng đưa ra đề xuất cải thiện." },
      { zh: "你有长期的职业规划吗？", pinyin: "nǐ yǒu cháng qī de zhí yè guī huà ma?", vi: "Bạn có kế hoạch nghề nghiệp dài hạn không?" },
      { zh: "有，希望五年内能独立负责一个项目。", pinyin: "yǒu, xī wàng wǔ nián nèi néng dú lì fù zé yī gè xiàng mù.", vi: "Có, hy vọng trong năm năm có thể độc lập phụ trách một dự án." },
      { zh: "加班对效率有帮助吗？", pinyin: "jiā bān duì xiào lǜ yǒu bāng zhù ma?", vi: "Tăng ca có giúp ích cho hiệu suất không?" },
      { zh: "偶尔可以，但长期加班反而降低效率。", pinyin: "ǒu ěr kě yǐ, dàn cháng qī jiā bān fǎn ér jiàng dī xiào lǜ.", vi: "Thỉnh thoảng được, nhưng tăng ca lâu dài ngược lại làm giảm hiệu suất." },
      { zh: "你最看重工作中的哪个方面？", pinyin: "nǐ zuì kàn zhòng gōng zuò zhōng de nǎ ge fāng miàn?", vi: "Bạn coi trọng nhất khía cạnh nào trong công việc?" },
      { zh: "成长机会和团队氛围。", pinyin: "chéng zhǎng jī huì hé tuán duì fēn wéi.", vi: "Cơ hội phát triển và bầu không khí nhóm." },

      // 2. Xã hội & quan điểm
      { zh: "你怎么看待年轻人晚婚的现象？", pinyin: "nǐ zěn me kàn dài nián qīng rén wǎn hūn de xiàn xiàng?", vi: "Bạn nhìn nhận hiện tượng thanh niên kết hôn muộn thế nào?" },
      { zh: "我认为是个人选择，应该尊重。", pinyin: "wǒ rèn wéi shì gè rén xuǎn zé, yīng gāi zūn zhòng.", vi: "Tôi cho rằng là lựa chọn cá nhân, nên tôn trọng." },
      { zh: "城市生活压力大不大？", pinyin: "chéng shì shēng huó yā lì dà bu dà?", vi: "Cuộc sống thành phố áp lực có lớn không?" },
      { zh: "确实不小，房价和节奏都很快。", pinyin: "què shí bù xiǎo, fáng jià hé jié zòu dōu hěn kuài.", vi: "Quả thật không nhỏ, giá nhà và nhịp sống đều rất nhanh." },
      { zh: "你赞成共享经济吗？", pinyin: "nǐ zàn chéng gòng xiǎng jīng jì ma?", vi: "Bạn có tán thành kinh tế chia sẻ không?" },
      { zh: "赞成，可以提高资源利用效率。", pinyin: "zàn chéng, kě yǐ tí gāo zī yuán lì yòng xiào lǜ.", vi: "Tán thành, có thể nâng cao hiệu suất sử dụng tài nguyên." },
      { zh: "社交媒体对生活有什么影响？", pinyin: "shè jiāo méi tǐ duì shēng huó yǒu shén me yǐng xiǎng?", vi: "Mạng xã hội ảnh hưởng gì đến cuộc sống?" },
      { zh: "方便了交流，但也容易分散注意力。", pinyin: "fāng biàn le jiāo liú, dàn yě róng yì fēn sàn zhù yì lì.", vi: "Tiện giao tiếp, nhưng cũng dễ phân tán sự chú ý." },
      { zh: "你觉得成功的标准是什么？", pinyin: "nǐ jué de chéng gōng de biāo zhǔn shì shén me?", vi: "Bạn thấy tiêu chuẩn thành công là gì?" },
      { zh: "因人而异，对我来说是内心的满足。", pinyin: "yīn rén ér yì, duì wǒ lái shuō shì nèi xīn de mǎn zú.", vi: "Tùy người, với tôi là sự thỏa mãn trong lòng." },
      { zh: "人口老龄化会带来哪些问题？", pinyin: "rén kǒu lǎo líng huà huì dài lái nǎ xiē wèn tí?", vi: "Dân số già hóa sẽ mang lại vấn đề gì?" },
      { zh: "养老压力增加，劳动力可能不足。", pinyin: "yǎng lǎo yā lì zēng jiā, láo dòng lì kě néng bù zú.", vi: "Áp lực dưỡng lão tăng, lực lượng lao động có thể thiếu." },
      { zh: "你支持保护传统文化吗？", pinyin: "nǐ zhī chí bǎo hù chuán tǒng wén huà ma?", vi: "Bạn có ủng hộ bảo vệ văn hóa truyền thống không?" },
      { zh: "当然支持，但也要与时俱进。", pinyin: "dāng rán zhī chí, dàn yě yào yǔ shí jù jìn.", vi: "Đương nhiên ủng hộ, nhưng cũng phải tiến cùng thời đại." },
      { zh: "志愿者活动有意义吗？", pinyin: "zhì yuàn zhě huó dòng yǒu yì yì ma?", vi: "Hoạt động tình nguyện có ý nghĩa không?" },
      { zh: "很有意义，既能帮助别人也能提升自己。", pinyin: "hěn yǒu yì yì, jì néng bāng zhù bié rén yě néng tí shēng zì jǐ.", vi: "Rất có ý nghĩa, vừa giúp người khác vừa nâng cao bản thân." },
      { zh: "你怎么理解公平？", pinyin: "nǐ zěn me lǐ jiě gōng píng?", vi: "Bạn hiểu công bằng thế nào?" },
      { zh: "机会平等比结果平等更重要。", pinyin: "jī huì píng děng bǐ jié guǒ píng děng gèng zhòng yào.", vi: "Cơ hội bình đẳng quan trọng hơn kết quả bình đẳng." },
      { zh: "网络谣言应该如何应对？", pinyin: "wǎng luò yáo yán yīng gāi rú hé yìng duì?", vi: "Tin đồn trên mạng nên đối phó thế nào?" },
      { zh: "提高辨别能力，不随意传播。", pinyin: "tí gāo biàn bié néng lì, bù suí yì chuán bō.", vi: "Nâng cao khả năng phân biệt, không tùy ý lan truyền." },

      // 3. Giáo dục & học tập
      { zh: "你觉得应试教育有什么问题？", pinyin: "nǐ jué de yìng shì jiào yù yǒu shén me wèn tí?", vi: "Bạn thấy giáo dục thi cử có vấn đề gì?" },
      { zh: "过分强调分数，忽视了创新能力。", pinyin: "guò fèn qiáng diào fēn shù, hū shì le chuàng xīn néng lì.", vi: "Quá nhấn mạnh điểm số, bỏ qua khả năng sáng tạo." },
      { zh: "出国留学值得吗？", pinyin: "chū guó liú xué zhí de ma?", vi: "Du học nước ngoài có đáng không?" },
      { zh: "要看个人目标和家庭条件。", pinyin: "yào kàn gè rén mù biāo hé jiā tíng tiáo jiàn.", vi: "Phải xem mục tiêu cá nhân và điều kiện gia đình." },
      { zh: "兴趣班对孩子有帮助吗？", pinyin: "xìng qù bān duì hái zi yǒu bāng zhù ma?", vi: "Lớp năng khiếu có giúp ích cho trẻ không?" },
      { zh: "适量有益，太多会增加压力。", pinyin: "shì liàng yǒu yì, tài duō huì zēng jiā yā lì.", vi: "Vừa phải thì có lợi, quá nhiều sẽ tăng áp lực." },
      { zh: "自学和上课哪个效果更好？", pinyin: "zì xué hé shàng kè nǎ ge xiào guǒ gèng hǎo?", vi: "Tự học và lên lớp cái nào hiệu quả hơn?" },
      { zh: "各有优势，最好结合起来。", pinyin: "gè yǒu yōu shì, zuì hǎo jié hé qǐ lái.", vi: "Mỗi cái có ưu điểm, tốt nhất là kết hợp." },
      { zh: "你如何提高阅读能力？", pinyin: "nǐ rú hé tí gāo yuè dú néng lì?", vi: "Bạn nâng cao khả năng đọc thế nào?" },
      { zh: "每天坚持阅读，并做笔记。", pinyin: "měi tiān jiān chí yuè dú, bìng zuò bǐ jì.", vi: "Mỗi ngày kiên trì đọc, và ghi chép." },
      { zh: "考试失败了该怎么办？", pinyin: "kǎo shì shī bài le gāi zěn me bàn?", vi: "Thi trượt rồi nên làm sao?" },
      { zh: "分析原因，调整方法再努力。", pinyin: "fēn xī yuán yīn, tiáo zhěng fāng fǎ zài nǔ lì.", vi: "Phân tích nguyên nhân, điều chỉnh phương pháp rồi cố gắng tiếp." },
      { zh: "老师对学生的影响大吗？", pinyin: "lǎo shī duì xué sheng de yǐng xiǎng dà ma?", vi: "Thầy cô ảnh hưởng lớn đến học sinh không?" },
      { zh: "很大，好老师能改变一个人的方向。", pinyin: "hěn dà, hǎo lǎo shī néng gǎi biàn yī gè rén de fāng xiàng.", vi: "Rất lớn, thầy tốt có thể thay đổi hướng đi của một người." },
      { zh: "你赞成取消部分考试吗？", pinyin: "nǐ zàn chéng qǔ xiāo bù fèn kǎo shì ma?", vi: "Bạn có tán thành hủy bỏ một số kỳ thi không?" },
      { zh: "可以减少不必要的考试，但要保留核心评估。", pinyin: "kě yǐ jiǎn shǎo bù bì yào de kǎo shì, dàn yào bǎo liú hé xīn píng gū.", vi: "Có thể giảm thi không cần thiết, nhưng phải giữ đánh giá cốt lõi." },
      { zh: "终身学习有必要吗？", pinyin: "zhōng shēn xué xí yǒu bì yào ma?", vi: "Học tập suốt đời có cần thiết không?" },
      { zh: "非常必要，社会变化太快了。", pinyin: "fēi cháng bì yào, shè huì biàn huà tài kuài le.", vi: "Rất cần thiết, xã hội thay đổi quá nhanh." },
      { zh: "你最想学什么新技能？", pinyin: "nǐ zuì xiǎng xué shén me xīn jì néng?", vi: "Bạn muốn học kỹ năng mới gì nhất?" },
      { zh: "编程或者一门新语言。", pinyin: "biān chéng huò zhě yī mén xīn yǔ yán.", vi: "Lập trình hoặc một ngôn ngữ mới." },

      // 4. Kinh tế & tiêu dùng
      { zh: "你怎么看待信用卡消费？", pinyin: "nǐ zěn me kàn dài xìn yòng kǎ xiāo fèi?", vi: "Bạn nhìn nhận tiêu dùng bằng thẻ tín dụng thế nào?" },
      { zh: "方便，但要控制好额度，避免负债。", pinyin: "fāng biàn, dàn yào kòng zhì hǎo é dù, bì miǎn fù zhài.", vi: "Tiện, nhưng phải kiểm soát hạn mức, tránh nợ." },

      { zh: "在线教育能取代传统课堂吗？", pinyin: "zài xiàn jiào yù néng qǔ dài chuán tǒng kè táng ma?", vi: "Giáo dục trực tuyến có thể thay thế lớp học truyền thống không?" },
      { zh: "不能完全取代，互动和氛围很重要。", pinyin: "bù néng wán quán qǔ dài, hù dòng hé fēn wéi hěn zhòng yào.", vi: "Không thể thay hoàn toàn, tương tác và không khí rất quan trọng." },
      { zh: "你怎么看待大数据？", pinyin: "nǐ zěn me kàn dài dà shù jù?", vi: "Bạn nhìn nhận dữ liệu lớn thế nào?" },
      { zh: "带来便利，但也要注意隐私保护。", pinyin: "dài lái biàn lì, dàn yě yào zhù yì yǐn sī bǎo hù.", vi: "Mang lại tiện lợi, nhưng cũng phải chú ý bảo vệ riêng tư." },
      { zh: "无人驾驶安全吗？", pinyin: "wú rén jià shǐ ān quán ma?", vi: "Lái tự động có an toàn không?" },
      { zh: "技术在进步，但还需进一步完善法规。", pinyin: "jì shù zài jìn bù, dàn hái xū jìn yī bù wán shàn fǎ guī.", vi: "Công nghệ đang tiến bộ, nhưng vẫn cần hoàn thiện quy định thêm." },
      { zh: "电子支付普及有什么好处？", pinyin: "diàn zǐ zhī fù pǔ jí yǒu shén me hǎo chu?", vi: "Thanh toán điện tử phổ biến có lợi gì?" },
      { zh: "方便快捷，减少现金流通成本。", pinyin: "fāng biàn kuài jié, jiǎn shǎo xiàn jīn liú tōng chéng běn.", vi: "Tiện lợi nhanh chóng, giảm chi phí lưu thông tiền mặt." },
      { zh: "你支持远程办公吗？", pinyin: "nǐ zhī chí yuǎn chéng bàn gōng ma?", vi: "Bạn có ủng hộ làm việc từ xa không?" },
      { zh: "部分岗位适合，但需要自律和沟通。", pinyin: "bù fèn gǎng wèi shì hé, dàn xū yào zì lǜ hé gōu tōng.", vi: "Một số vị trí phù hợp, nhưng cần tự giác và giao tiếp." },
      { zh: "科技创新的动力是什么？", pinyin: "kē jì chuàng xīn de dòng lì shì shén me?", vi: "Động lực đổi mới khoa học công nghệ là gì?" },
      { zh: "需求推动和竞争压力。", pinyin: "xū qiú tuī dòng hé jìng zhēng yā lì.", vi: "Nhu cầu thúc đẩy và áp lực cạnh tranh." },
      { zh: "你担心信息泄露吗？", pinyin: "nǐ dān xīn xìn xī xiè lòu ma?", vi: "Bạn có lo lắng rò rỉ thông tin không?" },
      { zh: "担心，所以注意保护个人隐私。", pinyin: "dān xīn, suǒ yǐ zhù yì bǎo hù gè rén yǐn sī.", vi: "Lo, nên chú ý bảo vệ riêng tư cá nhân." },
      { zh: "未来十年变化最大的领域是什么？", pinyin: "wèi lái shí nián biàn huà zuì dà de lǐng yù shì shén me?", vi: "Lĩnh vực thay đổi lớn nhất trong mười năm tới là gì?" },
      { zh: "人工智能和新能源。", pinyin: "rén gōng zhì néng hé xīn néng yuán.", vi: "Trí tuệ nhân tạo và năng lượng mới." },

      // 9. Quan hệ & giao tiếp
      { zh: "你如何处理同事之间的矛盾？", pinyin: "nǐ rú hé chǔ lǐ tóng shì zhī jiān de máo dùn?", vi: "Bạn xử lý mâu thuẫn giữa đồng nghiệp thế nào?" },
      { zh: "先沟通，站在对方角度想问题。", pinyin: "xiān gōu tōng, zhàn zài duì fāng jiǎo dù xiǎng wèn tí.", vi: "Giao tiếp trước, đứng ở góc độ đối phương suy nghĩ." },
      { zh: "亲密关系中最重要的是什么？", pinyin: "qīn mì guān xì zhōng zuì zhòng yào de shì shén me?", vi: "Trong quan hệ thân mật điều quan trọng nhất là gì?" },
      { zh: "信任和尊重。", pinyin: "xìn rèn hé zūn zhòng.", vi: "Tin tưởng và tôn trọng." },
      { zh: "你怎么看待异地恋？", pinyin: "nǐ zěn me kàn dài yì dì liàn?", vi: "Bạn nhìn nhận tình yêu xa thế nào?" },
      { zh: "考验很大，需要双方足够坚定。", pinyin: "kǎo yàn hěn dà, xū yào shuāng fāng zú gòu jiān dìng.", vi: "Thử thách lớn, cần hai bên đủ kiên định." },
      { zh: "朋友之间需要经常联系吗？", pinyin: "péng you zhī jiān xū yào jīng cháng lián xì ma?", vi: "Giữa bạn bè có cần thường xuyên liên lạc không?" },
      { zh: "不必天天联系，但关键时刻要在。", pinyin: "bú bì tiān tiān lián xì, dàn guān jiàn shí kè yào zài.", vi: "Không cần liên lạc mỗi ngày, nhưng lúc quan trọng phải có mặt." },
      { zh: "如何拒绝不合理的要求？", pinyin: "rú hé jù jué bù hé lǐ de yāo qiú?", vi: "Làm sao từ chối yêu cầu không hợp lý?" },
      { zh: "委婉但坚定地说明理由。", pinyin: "wěi wǎn dàn jiān dìng de shuō míng lǐ yóu.", vi: "Uyển chuyển nhưng kiên quyết nêu rõ lý do." },
      { zh: "你善于表达自己的感受吗？", pinyin: "nǐ shàn yú biǎo dá zì jǐ de gǎn shòu ma?", vi: "Bạn có giỏi bày tỏ cảm nhận của mình không?" },
      { zh: "还在学习中，有时会保留。", pinyin: "hái zài xué xí zhōng, yǒu shí huì bǎo liú.", vi: "Vẫn đang học, đôi khi sẽ giữ lại." },
      { zh: "批评别人时要注意什么？", pinyin: "pī píng bié rén shí yào zhù yì shén me?", vi: "Khi phê bình người khác cần chú ý gì?" },
      { zh: "对事不对人，语气要温和。", pinyin: "duì shì bú duì rén, yǔ qì yào wēn hé.", vi: "Nhắm vào việc không nhắm vào người, giọng điệu phải ôn hòa." },
      { zh: "你怎么维护长久关系？", pinyin: "nǐ zěn me wéi hù qīn qíng guān xì?", vi: "Bạn duy trì quan hệ tình cảm gia đình thế nào?" },
      { zh: "经常回家看看，多关心长辈。", pinyin: "jīng cháng huí jiā kàn kan, duō guān xīn zhǎng bèi.", vi: "Thường xuyên về nhà thăm, quan tâm người lớn nhiều hơn." },
      { zh: "社交中最忌讳什么？", pinyin: "shè jiāo zhōng zuì jì huì shén me?", vi: "Trong giao tiếp xã hội kiêng kỵ nhất điều gì?" },
      { zh: "不守信用和背后议论别人。", pinyin: "bù shǒu xìn yòng hé bèi hòu yì lùn bié rén.", vi: "Không giữ chữ tín và bàn tán sau lưng người khác." },
      { zh: "你如何建立信任？", pinyin: "nǐ rú hé jiàn lì xìn rèn?", vi: "Bạn xây dựng lòng tin thế nào?" },
      { zh: "言行一致，真诚对待他人。", pinyin: "yán xíng yī zhì, zhēn chéng duì dài tā rén.", vi: "Nói đi đôi với làm, chân thành đối xử với người khác." },

      // 10. Phản xạ tình huống tổng hợp
      { zh: "你对目前的工作满意吗？希望有更大发展空间。", pinyin: "nǐ duì mù qián de gōng zuò mǎn yì ma? xī wàng yǒu gèng dà fā zhǎn kōng jiān.", vi: "Bạn hài lòng với công việc hiện tại không? Hy vọng có không gian phát triển lớn hơn." },
      { zh: "面试时诚实和自信都很关键。", pinyin: "miàn shì shí chéng shí hé zì xìn dōu hěn guān jiàn.", vi: "Khi phỏng vấn thành thật và tự tin đều rất quan trọng." },
      { zh: "你怎么看待年轻人晚婚？我认为是个人选择。", pinyin: "nǐ zěn me kàn dài nián qīng rén wǎn hūn? wǒ rèn wéi shì gè rén xuǎn zé.", vi: "Bạn nhìn nhận thanh niên kết hôn muộn thế nào? Tôi cho là lựa chọn cá nhân." },
      { zh: "城市生活压力不小，房价和节奏都很快。", pinyin: "chéng shì shēng huó yā lì bù xiǎo, fáng jià hé jié zòu dōu hěn kuài.", vi: "Áp lực sống thành phố không nhỏ, giá nhà và nhịp sống đều rất nhanh." },
      { zh: "应试教育过分强调分数，忽视了创新能力。", pinyin: "yìng shì jiào yù guò fèn qiáng diào fēn shù, hū shì le chuàng xīn néng lì.", vi: "Giáo dục thi cử quá nhấn mạnh điểm số, bỏ qua khả năng sáng tạo." },
      { zh: "终身学习非常必要，社会变化太快了。", pinyin: "zhōng shēn xué xí fēi cháng bì yào, shè huì biàn huà tài kuài le.", vi: "Học tập suốt đời rất cần thiết, xã hội thay đổi quá nhanh." },
      { zh: "信用卡方便，但要控制额度，避免负债。", pinyin: "xìn yòng kǎ fāng biàn, dàn yào kòng zhì é dù, bì miǎn fù zhài.", vi: "Thẻ tín dụng tiện, nhưng phải kiểm soát hạn mức, tránh nợ." },
      { zh: "个人能为环保做：减少塑料，节约水电，绿色出行。", pinyin: "gè rén néng wèi huán bǎo zuò: jiǎn shǎo sù liào, jié yuē shuǐ diàn, lǜ sè chū xíng.", vi: "Cá nhân có thể làm cho môi trường: giảm nhựa, tiết kiệm điện nước, di chuyển xanh." },
      { zh: "发展经济和保护环境长期必须统一。", pinyin: "fā zhǎn jīng jì hé bǎo hù huán jìng cháng qī bì xū tǒng yī.", vi: "Phát triển kinh tế và bảo vệ môi trường dài hạn phải thống nhất." },
      { zh: "传统节日要结合现代生活，让年轻人愿意参与。", pinyin: "chuán tǒng jié rì yào jié hé xiàn dài shēng huó, ràng nián qīng rén yuàn yì cān yù.", vi: "Ngày lễ truyền thống phải kết hợp đời sống hiện đại, để thanh niên sẵn sàng tham gia." },
      { zh: "规律作息、适量运动、均衡饮食是保持健康的关键。", pinyin: "guī lǜ zuò xī, shì liàng yùn dòng, jūn héng yǐn shí shì bǎo chí jiàn kāng de guān jiàn.", vi: "Sinh hoạt đều, vận động vừa, ăn uống cân bằng là chìa khóa giữ sức khỏe." },
      { zh: "心理健康和身体健康一样重要。", pinyin: "xīn lǐ jiàn kāng hé shēn tǐ jiàn kāng yī yàng zhòng yào.", vi: "Sức khỏe tâm lý quan trọng như sức khỏe thể chất." },
      { zh: "人工智能会取代部分工作，也会创造新岗位。", pinyin: "rén gōng zhì néng huì qǔ dài bù fèn gōng zuò, yě huì chuàng zào xīn gǎng wèi.", vi: "AI sẽ thay một phần công việc, cũng tạo vị trí mới." },
      { zh: "大数据带来便利，但也要注意隐私保护。", pinyin: "dà shù jù dài lái biàn lì, dàn yě yào zhù yì yǐn sī bǎo hù.", vi: "Dữ liệu lớn mang lại tiện lợi, nhưng cũng phải chú ý bảo vệ riêng tư." },
      { zh: "处理矛盾先沟通，站在对方角度想问题。", pinyin: "chǔ lǐ máo dùn xiān gōu tōng, zhàn zài duì fāng jiǎo dù xiǎng wèn tí.", vi: "Xử lý mâu thuẫn giao tiếp trước, đứng góc độ đối phương suy nghĩ." },
      { zh: "亲密关系中最重要的是信任和尊重。", pinyin: "qīn mì guān xì zhōng zuì zhòng yào de shì xìn rèn hé zūn zhòng.", vi: "Trong quan hệ thân mật điều quan trọng nhất là tin tưởng và tôn trọng." },
      { zh: "拒绝不合理要求时，要委婉但坚定地说明理由。", pinyin: "jù jué bù hé lǐ yāo qiú shí, yào wěi wǎn dàn jiān dìng de shuō míng lǐ yóu.", vi: "Khi từ chối yêu cầu không hợp lý, phải uyển chuyển nhưng kiên quyết nêu lý do." },
      { zh: "言行一致，真诚对待他人，才能建立信任。", pinyin: "yán xíng yī zhì, zhēn chéng duì dài tā rén, cái néng jiàn lì xìn rèn.", vi: "Nói đi đôi với làm, chân thành với người khác, mới xây dựng được lòng tin." },
      { zh: "感谢你的分享，让我学到了很多。", pinyin: "gǎn xiè nǐ de fēn xiǎng, ràng wǒ xué dào le hěn duō.", vi: "Cảm ơn sự chia sẻ của bạn, giúp tôi học được nhiều." },
      { zh: "保持联系，有机会再深入交流。祝一切顺利！", pinyin: "bǎo chí lián xì, yǒu jī huì zài shēn rù jiāo liú. zhù yī qiè shùn lì!", vi: "Giữ liên lạc, có dịp trao đổi sâu hơn. Chúc mọi việc suôn sẻ!" }
    ]

      // 1. Du lịch & trải nghiệm
      { zh: "你最近去哪里旅游了？", pinyin: "nǐ zuì jìn qù nǎ lǐ lǚ yóu le?", vi: "Gần đây bạn đi du lịch ở đâu?" },
      { zh: "去了云南，风景非常漂亮。", pinyin: "qù le Yún nán, fēng jǐng fēi cháng piào liang.", vi: "Đi Vân Nam, phong cảnh rất đẹp." },
      { zh: "旅行中最难忘的是什么？", pinyin: "lǚ xíng zhōng zuì nán wàng de shì shén me?", vi: "Trong chuyến đi điều khó quên nhất là gì?" },
      { zh: "和当地人交流的经历。", pinyin: "hé dāng dì rén jiāo liú de jīng lì.", vi: "Trải nghiệm giao tiếp với người địa phương." },
      { zh: "独自旅行和结伴旅行哪个更好？", pinyin: "dú zì lǚ xíng hé jié bàn lǚ xíng nǎ ge gèng hǎo?", vi: "Du lịch một mình và đi cùng bạn cái nào tốt hơn?" },
      { zh: "各有好处，看个人喜好。", pinyin: "gè yǒu hǎo chu, kàn gè rén xǐ hào.", vi: "Mỗi cái có cái hay, tùy sở thích cá nhân." },
      { zh: "预订酒店时要注意什么？", pinyin: "yù dìng jiǔ diàn shí yào zhù yì shén me?", vi: "Khi đặt khách sạn cần chú ý gì?" },
      { zh: "位置、评价和取消政策。", pinyin: "wèi zhì, píng jià hé qǔ xiāo zhèng cè.", vi: "Vị trí, đánh giá và chính sách hủy." },
      { zh: "你喜欢跟团还是自由行？", pinyin: "nǐ xǐ huan gēn tuán hái shì zì yóu xíng?", vi: "Bạn thích đi theo đoàn hay tự do?" },

      { zh: "旅途中丢了东西怎么办？", pinyin: "lǚ tú zhōng diū le dōng xi zěn me bàn?", vi: "Trên đường mất đồ thì làm sao?" },

      { zh: "旅行能带来什么收获？", pinyin: "lǚ xíng néng dài lái shén me shōu huò?", vi: "Du lịch mang lại thu hoạch gì?" },
      { zh: "开阔视野，了解不同文化。", pinyin: "kāi kuò shì yě, liǎo jiě bù tóng wén huà.", vi: "Mở rộng tầm nhìn, hiểu các nền văn hóa khác." },
      { zh: "你计划下次去哪里？", pinyin: "nǐ jì huà xià cì qù nǎ lǐ?", vi: "Bạn dự định lần sau đi đâu?" },
      { zh: "想去海边放松一下。", pinyin: "xiǎng qù hǎi biān fàng sōng yī xià.", vi: "Muốn ra biển thư giãn một chút." },
      { zh: "旅行前需要做哪些准备？", pinyin: "lǚ xíng qián xū yào zuò nǎ xiē zhǔn bèi?", vi: "Trước khi đi du lịch cần chuẩn bị gì?" },

      { zh: "到了，停车费谁出？", pinyin: "dào le, tíng chē fèi shuí chū?", vi: "Đến rồi, phí đỗ xe ai trả?" },
      { zh: "你先付，我转给你。", pinyin: "nǐ xiān fù, wǒ zhuǎn gěi nǐ.", vi: "Bạn trả trước, tôi chuyển cho bạn." },
      { zh: "路不熟，开导航吧。", pinyin: "lù bù shóu, kāi dǎo háng ba.", vi: "Đường không quen, bật điều hướng đi." },
      { zh: "下个路口右转。", pinyin: "xià gè lù kǒu yòu zhuǎn.", vi: "Ngã tư tiếp theo rẽ phải." },
      { zh: "堵车了，换条路试试。", pinyin: "dǔ chē le, huàn tiáo lù shì shi.", vi: "Kẹt xe rồi, đổi đường thử xem." },
      { zh: "终于到了，辛苦了。", pinyin: "zhōng yú dào le, xīn kǔ le.", vi: "Cuối cùng đến rồi, vất vả rồi." },
      { zh: "五星好评，服务不错。", pinyin: "wǔ xīng hǎo píng, fú wù bù cuò.", vi: "Đánh giá năm sao, dịch vụ ổn." },
      { zh: "下次见，一路顺风。", pinyin: "xià cì jiàn, yī lù shùn fēng.", vi: "Lần sau gặp, thượng lộ bình an." },

      // 7
      { zh: "停电了，蜡烛在哪里？", pinyin: "tíng diàn le, là zhú zài nǎ lǐ?", vi: "Mất điện rồi, nến ở đâu?" },
      { zh: "抽屉里有，我去拿。", pinyin: "chōu ti lǐ yǒu, wǒ qù ná.", vi: "Trong ngăn kéo có, tôi đi lấy." },
      { zh: "手机还能用一会儿。", pinyin: "shǒu jī hái néng yòng yī huìr.", vi: "Điện thoại còn dùng được một lúc." },
      { zh: "通知说一个小时后恢复。", pinyin: "tōng zhī shuō yī gè xiǎo shí hòu huī fù.", vi: "Thông báo nói một tiếng sau khôi phục." },
      { zh: "趁现在把该做的事做了。", pinyin: "chèn xiàn zài bǎ gāi zuò de shì zuò le.", vi: "Nhân lúc này làm nốt việc cần làm." },
      { zh: "电梯停了，走楼梯吧。", pinyin: "diàn tī tíng le, zǒu lóu tī ba.", vi: "Thang máy dừng, đi bộ cầu thang đi." },
      { zh: "爬六楼有点累。", pinyin: "pá liù lóu yǒu diǎn lèi.", vi: "Leo sáu tầng hơi mệt." },
      { zh: "锻炼一下也挺好。", pinyin: "duàn liàn yī xià yě tǐng hǎo.", vi: "Rèn luyện một chút cũng khá tốt." },
      { zh: "来电了，灯亮了！", pinyin: "lái diàn le, dēng liàng le!", vi: "Có điện rồi, đèn sáng rồi!" },
      { zh: "赶紧把冰箱门关上。", pinyin: "gǎn jǐn bǎ bīng xiāng mén guān shàng.", vi: "Mau đóng cửa tủ lạnh lại." },
      { zh: "热水也恢复了，可以洗澡。", pinyin: "rè shuǐ yě huī fù le, kě yǐ xǐ zǎo.", vi: "Nước nóng cũng khôi phục, có thể tắm." },
      { zh: "停电期间无聊，聊聊天。", pinyin: "tíng diàn qī jiān wú liáo, liáo liao tiān.", vi: "Trong lúc mất điện buồn, trò chuyện đi." },
      { zh: "其实也挺有意思的。", pinyin: "qí shí yě tǐng yǒu yì si de.", vi: "Thực ra cũng khá thú vị." },
      { zh: "下次准备点应急物品。", pinyin: "xià cì zhǔn bèi diǎn yìng jí wù pǐn.", vi: "Lần sau chuẩn bị chút đồ dự phòng." },
      { zh: "手电筒、充电宝都要有。", pinyin: "shǒu diàn tǒng, chōng diàn bǎo dōu yào yǒu.", vi: "Đèn pin, sạc dự phòng đều phải có." },
      { zh: "社区群里大家互相提醒。", pinyin: "shè qū qún lǐ dà jiā hù xiāng tí xǐng.", vi: "Trong nhóm cộng đồng mọi người nhắc nhau." },
      { zh: "邻里关系好，遇事不慌。", pinyin: "lín lǐ guān xì hǎo, yù shì bù huāng.", vi: "Quan hệ hàng xóm tốt, gặp việc không hoảng." },
      { zh: "互相帮助很重要。", pinyin: "hù xiāng bāng zhù hěn zhòng yào.", vi: "Giúp đỡ lẫn nhau rất quan trọng." },
      { zh: "今天算是一次小考验。", pinyin: "jīn tiān suàn shì yī cì xiǎo kǎo yàn.", vi: "Hôm nay coi như một thử thách nhỏ." },
      { zh: "挺过去就好了。", pinyin: "tǐng guò qù jiù hǎo le.", vi: "Vượt qua là ổn." },

      // 8
      { zh: "闹钟定了三个，还是起晚了。", pinyin: "nào zhōng dìng le sān gè, hái shì qǐ wǎn le.", vi: "Đặt ba báo thức, vẫn dậy muộn." },
      { zh: "昨晚睡太晚了。", pinyin: "zuó wǎn shuì tài wǎn le.", vi: "Tối qua ngủ muộn quá." },
      { zh: "今天中午必须午睡。", pinyin: "jīn tiān zhōng wǔ bì xū wǔ shuì.", vi: "Hôm nay trưa phải ngủ trưa." },
      { zh: "午饭吃太撑了，想躺一会儿。", pinyin: "wǔ fàn chī tài chēng le, xiǎng tǎng yī huìr.", vi: "Cơm trưa ăn no quá, muốn nằm một lúc." },
      { zh: "下午犯困，喝杯咖啡提神。", pinyin: "xià wǔ fàn kùn, hē bēi kā fēi tí shén.", vi: "Chiều buồn ngủ, uống ly cà phê tỉnh táo." },
      { zh: "咖啡因太多晚上会睡不着。", pinyin: "kā fēi yīn tài duō wǎn shang huì shuì bu zháo.", vi: "Caffeine nhiều quá tối sẽ ngủ không được." },
      { zh: "改喝茶吧。", pinyin: "gǎi hē chá ba.", vi: "Đổi sang uống trà đi." },
      { zh: "下班后去超市买点零食。", pinyin: "xià bān hòu qù chāo shì mǎi diǎn líng shí.", vi: "Tan làm đi siêu thị mua chút đồ ăn vặt." },
      { zh: "别买太多，不健康。", pinyin: "bié mǎi tài duō, bù jiàn kāng.", vi: "Đừng mua quá nhiều, không lành mạnh." },
      { zh: "就买一包，解解馋。", pinyin: "jiù mǎi yī bāo, jiě jie chán.", vi: "Chỉ mua một gói, giải ghiền." },
      { zh: "回家路上遇到同事，聊了几句。", pinyin: "huí jiā lù shàng yù dào tóng shì, liáo le jǐ jù.", vi: "Trên đường về gặp đồng nghiệp, nói vài câu." },
      { zh: "约好周末一起吃饭。", pinyin: "yuē hǎo zhōu mò yī qǐ chī fàn.", vi: "Hẹn cuối tuần cùng ăn cơm." },
      { zh: "到家先换衣服，再做饭。", pinyin: "dào jiā xiān huàn yī fu, zài zuò fàn.", vi: "Về nhà đổi quần áo trước, rồi nấu cơm." },
      { zh: "今天想吃面，简单点。", pinyin: "jīn tiān xiǎng chī miàn, jiǎn dān diǎn.", vi: "Hôm nay muốn ăn mì, đơn giản thôi." },
      { zh: "面好了，来吃吧。", pinyin: "miàn hǎo le, lái chī ba.", vi: "Mì xong rồi, đến ăn đi." },
      { zh: "吃完洗碗，然后休息。", pinyin: "chī wán xǐ wǎn, rán hòu xiū xi.", vi: "Ăn xong rửa bát, rồi nghỉ." },
      { zh: "刷会儿手机就睡觉。", pinyin: "shuā huìr shǒu jī jiù shuì jiào.", vi: "Lướt điện thoại một lúc rồi ngủ." },
      { zh: "别刷太久，伤眼睛。", pinyin: "bié shuā tài jiǔ, shāng yǎn jing.", vi: "Đừng lướt quá lâu, hại mắt." },
      { zh: "定个闹钟，明天还要早起。", pinyin: "dìng gè nào zhōng, míng tiān hái yào zǎo qǐ.", vi: "Đặt báo thức, ngày mai còn phải dậy sớm." },
      { zh: "好，晚安。", pinyin: "hǎo, wǎn ān.", vi: "Được, ngủ ngon." },

      // 9
      { zh: "周末懒觉真幸福。", pinyin: "zhōu mò lǎn jiào zhēn xìng fú.", vi: "Cuối tuần ngủ nướng thật hạnh phúc." },
      { zh: "十点才起来，精神多了。", pinyin: "shí diǎn cái qǐ lái, jīng shén duō le.", vi: "Mười giờ mới dậy, tinh thần hơn nhiều." },
      { zh: "brunch吃点什么？", pinyin: "brunch chī diǎn shén me?", vi: "Brunch ăn gì?" },
      { zh: "三明治配咖啡，简单又好吃。", pinyin: "sān míng zhì pèi kā fēi, jiǎn dān yòu hǎo chī.", vi: "Sandwich kèm cà phê, đơn giản lại ngon." },
      { zh: "下午有约吗？", pinyin: "xià wǔ yǒu yuē ma?", vi: "Chiều có hẹn không?" },
      { zh: "想去书店逛逛。", pinyin: "xiǎng qù shū diàn guàng guang.", vi: "Muốn đi hiệu sách dạo." },
      { zh: "好，顺便喝杯奶茶。", pinyin: "hǎo, shùn biàn hē bēi nǎi chá.", vi: "Được, tiện thể uống ly trà sữa." },
      { zh: "买了本新书，晚上看。", pinyin: "mǎi le běn xīn shū, wǎn shang kàn.", vi: "Mua một cuốn sách mới, tối đọc." },
      { zh: "晚上做顿好的犒劳自己。", pinyin: "wǎn shang zuò dùn hǎo de kào lao zì jǐ.", vi: "Tối nấu bữa ngon đãi bản thân." },
      { zh: "红烧排骨怎么样？", pinyin: "hóng shāo pái gǔ zěn me yàng?", vi: "Sườn kho thế nào?" },
      { zh: "太好了，我最爱。", pinyin: "tài hǎo le, wǒ zuì ài.", vi: "Tốt quá, tôi thích nhất." },
      { zh: "做饭放音乐，心情好。", pinyin: "zuò fàn fàng yīn yuè, xīn qíng hǎo.", vi: "Nấu cơm mở nhạc, tâm trạng tốt." },
      { zh: "吃完散步消化一下。", pinyin: "chī wán sàn bù xiāo huà yī xià.", vi: "Ăn xong đi dạo tiêu hóa một chút." },
      { zh: "小区花园人真多。", pinyin: "xiǎo qū huā yuán rén zhēn duō.", vi: "Vườn khu dân cư người đông thật." },
      { zh: "大家周末都出来活动。", pinyin: "dà jiā zhōu mò dōu chū lái huó dòng.", vi: "Mọi người cuối tuần đều ra ngoài hoạt động." },
      { zh: "碰到熟人聊了几句。", pinyin: "pèng dào shóu rén liáo le jǐ jù.", vi: "Gặp người quen nói vài câu." },
      { zh: "回家洗澡，准备睡觉。", pinyin: "huí jiā xǐ zǎo, zhǔn bèi shuì jiào.", vi: "Về nhà tắm, chuẩn bị ngủ." },
      { zh: "周末过得好充实。", pinyin: "zhōu mò guò de hǎo chōng shí.", vi: "Cuối tuần qua thật trọn vẹn." },
      { zh: "明天又要上班了。", pinyin: "míng tiān yòu yào shàng bān le.", vi: "Ngày mai lại phải đi làm rồi." },
      { zh: "充好电，新的一周加油。", pinyin: "chōng hǎo diàn, xīn de yī zhōu jiā yóu.", vi: "Sạc đầy pin, tuần mới cố gắng." },

      // 10
      { zh: "闹钟没响，差点迟到。赶紧出门，路上可能堵车。", pinyin: "nào zhōng méi xiǎng, chà diǎn chí dào. gǎn jǐn chū mén, lù shàng kě néng dǔ chē.", vi: "Báo thức không kêu, suýt muộn. Mau ra ngoài, đường có thể kẹt." },
      { zh: "早饭来不及，买个包子。钥匙忘带，得回去拿。", pinyin: "zǎo fàn lái bu jí, mǎi gè bāo zi. yào shi wàng dài, děi huí qù ná.", vi: "Sáng không kịp, mua bánh bao. Quên chìa khóa, phải về lấy." },
      { zh: "邻居装修好吵。可以礼貌沟通一下。", pinyin: "lín jū zhuāng xiū hǎo chǎo. kě yǐ lǐ mào gōu tōng yī xià.", vi: "Hàng xóm sửa nhà ồn. Có thể lịch sự trao đổi." },
      { zh: "物业通知停水，提前接满桶。", pinyin: "wù yè tōng zhī tíng shuǐ, tí qián jiē mǎn tǒng.", vi: "Ban quản lý thông báo cắt nước, trữ đầy xô trước." },
      { zh: "感冒嗓子疼，多喝热水好好休息。", pinyin: "gǎn mào sǎng zi téng, duō hē rè shuǐ hǎo hǎo xiū xi.", vi: "Cảm đau họng, uống nhiều nước nóng nghỉ thật tốt." },
      { zh: "请假一天比较好，说明原因就行。", pinyin: "qǐng jià yī tiān bǐ jiào hǎo, shuō míng yuán yīn jiù xíng.", vi: "Xin nghỉ một ngày tốt hơn, nêu rõ lý do là được." },
      { zh: "超市打折多买点，但别买太多怕放坏。", pinyin: "chāo shì dǎ zhé duō mǎi diǎn, dàn bié mǎi tài duō pà fàng huài.", vi: "Siêu thị giảm giá mua thêm, nhưng đừng nhiều sợ hỏng." },
      { zh: "结账发现没带钱包，可以用手机支付。", pinyin: "jié zhàng fā xiàn méi dài qián bāo, kě yǐ yòng shǒu jī zhī fù.", vi: "Thanh toán mới biết quên ví, có thể dùng điện thoại trả." },
      { zh: "朋友突然来访，简单收拾一下没关系。", pinyin: "péng you tū rán lái fǎng, jiǎn dān shōu shi yī xià méi guān xi.", vi: "Bạn đột nhiên đến, dọn đơn giản một chút không sao." },
      { zh: "父母打电话来，最近还好，多注意身体。", pinyin: "fù mǔ dǎ diàn huà lái, zuì jìn hái hǎo, duō zhù yì shēn tǐ.", vi: "Bố mẹ gọi đến, gần đây ổn, chú ý sức khỏe." },
      { zh: "地铁刷卡失败，用手机扫码过闸。", pinyin: "dì tiě shuā kǎ shī bài, yòng shǒu jī sǎo mǎ guò zhà.", vi: "Quẹt thẻ tàu thất bại, dùng điện thoại quét mã qua cổng." },
      { zh: "给老人让座，年轻人真有礼貌。", pinyin: "gěi lǎo rén ràng zuò, nián qīng rén zhēn yǒu lǐ mào.", vi: "Nhường ghế người già, thanh niên thật lịch sự." },
      { zh: "停电了，拿蜡烛。通知说一小时后恢复。", pinyin: "tíng diàn le, ná là zhú. tōng zhī shuō yī xiǎo shí hòu huī fù.", vi: "Mất điện, lấy nến. Thông báo nói một tiếng sau khôi phục." },
      { zh: "来电了！赶紧关冰箱门。", pinyin: "lái diàn le! gǎn jǐn guān bīng xiāng mén.", vi: "Có điện rồi! Mau đóng cửa tủ lạnh." },
      { zh: "周末懒觉真幸福，十点才起来精神多了。", pinyin: "zhōu mò lǎn jiào zhēn xìng fú, shí diǎn cái qǐ lái jīng shén duō le.", vi: "Cuối tuần ngủ nướng thật hạnh phúc, mười giờ dậy tinh thần hơn." },
      { zh: "下午去书店逛逛，顺便喝杯奶茶。", pinyin: "xià wǔ qù shū diàn guàng guang, shùn biàn hē bēi nǎi chá.", vi: "Chiều đi hiệu sách dạo, tiện thể uống ly trà sữa." },
      { zh: "晚上做顿好的犒劳自己，红烧排骨怎么样？", pinyin: "wǎn shang zuò dùn hǎo de kào lao zì jǐ, hóng shāo pái gǔ zěn me yàng?", vi: "Tối nấu bữa ngon đãi bản thân, sườn kho thế nào?" },
      { zh: "周末过得好充实，充好电新的一周加油。", pinyin: "zhōu mò guò de hǎo chōng shí, chōng hǎo diàn xīn de yī zhōu jiā yóu.", vi: "Cuối tuần qua thật trọn vẹn, sạc đầy pin tuần mới cố gắng." },
      { zh: "生活有起有落，互相帮助就好。", pinyin: "shēng huó yǒu qǐ yǒu luò, hù xiāng bāng zhù jiù hǎo.", vi: "Cuộc sống có lên có xuống, giúp đỡ lẫn nhau là được." },
      { zh: "祝你每天都有好心情！", pinyin: "zhù nǐ měi tiān dōu yǒu hǎo xīn qíng!", vi: "Chúc bạn mỗi ngày đều có tâm trạng tốt!" }
    ]

      { zh: "你打算去哪里旅游？", pinyin: "nǐ dǎ suàn qù nǎ lǐ lǚ yóu?", vi: "Bạn định đi du lịch ở đâu?" },

      { zh: "可以便宜点吗？", pinyin: "kě yǐ pián yi diǎn ma?", vi: "Có thể rẻ hơn không?" },
      { zh: "最低七十。", pinyin: "zuì dī qī shí.", vi: "Thấp nhất bảy mươi." },
      { zh: "是本地产的吗？", pinyin: "shì běn dì chǎn de ma?", vi: "Có phải sản xuất địa phương không?" },
      { zh: "是的，纯手工。", pinyin: "shì de, chún shǒu gōng.", vi: "Đúng, thủ công hoàn toàn." },
      { zh: "容易碎吗？", pinyin: "róng yì suì ma?", vi: "Có dễ vỡ không?" },
      { zh: "包装很结实，可以托运。", pinyin: "bāo zhuāng hěn jié shi, kě yǐ tuō yùn.", vi: "Đóng gói chắc chắn, có thể ký gửi." },
      { zh: "有没有更小一点的？", pinyin: "yǒu méi yǒu gèng xiǎo yī diǎn de?", vi: "Có cái nhỏ hơn không?" },
      { zh: "有，这个方便带。", pinyin: "yǒu, zhè ge fāng biàn dài.", vi: "Có, cái này tiện mang." },
      { zh: "可以开发票吗？", pinyin: "kě yǐ kāi fā piào ma?", vi: "Có thể xuất hóa đơn không?" },
      { zh: "可以。", pinyin: "kě yǐ.", vi: "Được." },
      { zh: "帮我包一下。", pinyin: "bāng wǒ bāo yī xià.", vi: "Giúp tôi gói một chút." },
      { zh: "好的。", pinyin: "hǎo de.", vi: "Được." },
      { zh: "这个适合送人吗？", pinyin: "zhè ge shì hé sòng rén ma?", vi: "Cái này phù hợp để tặng không?" },
      { zh: "很合适，很多游客买。", pinyin: "hěn hé shì, hěn duō yóu kè mǎi.", vi: "Rất phù hợp, nhiều du khách mua." },
      { zh: "我买两个。", pinyin: "wǒ mǎi liǎng gè.", vi: "Tôi mua hai cái." },
      { zh: "谢谢。", pinyin: "xiè xie.", vi: "Cảm ơn." },

      // 8. Thời tiết & trang phục
      { zh: "明天天气怎么样？", pinyin: "míng tiān tiān qì zěn me yàng?", vi: "Ngày mai thời tiết thế nào?" },
      { zh: "多云，有点凉。", pinyin: "duō yún, yǒu diǎn liáng.", vi: "Nhiều mây, hơi mát." },
      { zh: "需要带伞吗？", pinyin: "xū yào dài sǎn ma?", vi: "Cần mang ô không?" },
      { zh: "可能会下雨，最好带。", pinyin: "kě néng huì xià yǔ, zuì hǎo dài.", vi: "Có thể mưa, tốt nhất mang theo." },
      { zh: "白天热不热？", pinyin: "bái tiān rè bu rè?", vi: "Ban ngày có nóng không?" },
      { zh: "中午比较热，早晚凉。", pinyin: "zhōng wǔ bǐ jiào rè, zǎo wǎn liáng.", vi: "Trưa khá nóng, sáng tối mát." },
      { zh: "要穿厚衣服吗？", pinyin: "yào chuān hòu yī fu ma?", vi: "Có cần mặc đồ dày không?" },
      { zh: "带一件外套就够了。", pinyin: "dài yī jiàn wài tào jiù gòu le.", vi: "Mang một áo khoác là đủ." },
      { zh: "紫外线强吗？", pinyin: "zǐ wài xiàn qiáng ma?", vi: "Tia cực tím có mạnh không?" },
      { zh: "强，建议涂防晒。", pinyin: "qiáng, jiàn yì tú fáng shài.", vi: "Mạnh, khuyên bôi kem chống nắng." },
      { zh: "山上冷不冷？", pinyin: "shān shàng lěng bu lěng?", vi: "Trên núi có lạnh không?" },
      { zh: "比山下低十几度。", pinyin: "bǐ shān xià dī shí jǐ dù.", vi: "Thấp hơn chân núi hơn mười độ." },
      { zh: "有风吗？", pinyin: "yǒu fēng ma?", vi: "Có gió không?" },
      { zh: "海边风比较大。", pinyin: "hǎi biān fēng bǐ jiào dà.", vi: "Bên biển gió khá lớn." },
      { zh: "适合穿运动鞋吗？", pinyin: "shì hé chuān yùn dòng xié ma?", vi: "Có phù hợp đi giày thể thao không?" },
      { zh: "适合，走路比较多。", pinyin: "shì hé, zǒu lù bǐ jiào duō.", vi: "Phù hợp, đi bộ khá nhiều." },
      { zh: "湿度大吗？", pinyin: "shī dù dà ma?", vi: "Độ ẩm có cao không?" },
      { zh: "有点潮湿，衣服不易干。", pinyin: "yǒu diǎn cháo shī, yī fu bù yì gān.", vi: "Hơi ẩm, quần áo khó khô." },
      { zh: "天气预报准吗？", pinyin: "tiān qì yù bào zhǔn ma?", vi: "Dự báo thời tiết có chính xác không?" },
      { zh: "大体准，但山区变化快。", pinyin: "dà tǐ zhǔn, dàn shān qū biàn huà kuài.", vi: "Đại thể đúng, nhưng vùng núi thay đổi nhanh." },

      // 9. Sự cố & hỗ trợ
      { zh: "我的护照丢了。", pinyin: "wǒ de hù zhào diū le.", vi: "Hộ chiếu của tôi mất rồi." },
      { zh: "先报警，再联系使馆。", pinyin: "xiān bào jǐng, zài lián xì shǐ guǎn.", vi: "Báo cảnh sát trước, rồi liên hệ đại sứ quán." },
      { zh: "钱包被偷了。", pinyin: "qián bāo bèi tōu le.", vi: "Ví bị mất trộm." },
      { zh: "马上报警，冻结银行卡。", pinyin: "mǎ shàng bào jǐng, dòng jié yín háng kǎ.", vi: "Báo cảnh sát ngay, khóa thẻ ngân hàng." },
      { zh: "手机没电了，有充电宝吗？", pinyin: "shǒu jī méi diàn le, yǒu chōng diàn bǎo ma?", vi: "Điện thoại hết pin, có sạc dự phòng không?" },
      { zh: "前台可以借。", pinyin: "qián tái kě yǐ jiè.", vi: "Lễ tân có thể mượn." },
      { zh: "我迷路了。", pinyin: "wǒ mí lù le.", vi: "Tôi lạc đường rồi." },
      { zh: "您在哪个路口？我帮您看。", pinyin: "nín zài nǎ ge lù kǒu? wǒ bāng nín kàn.", vi: "Anh/chị đang ở ngã tư nào? Tôi giúp xem." },
      { zh: "身体不舒服。", pinyin: "shēn tǐ bù shū fu.", vi: "Cơ thể không khỏe." },
      { zh: "附近有医院，我陪您去。", pinyin: "fù jìn yǒu yī yuàn, wǒ péi nín qù.", vi: "Gần đây có bệnh viện, tôi đi cùng anh/chị." },
      { zh: "航班取消了怎么办？", pinyin: "háng bān qǔ xiāo le zěn me bàn?", vi: "Chuyến bay bị hủy thì làm sao?" },
      { zh: "可以改签或退票，找航空公司。", pinyin: "kě yǐ gǎi qiān huò tuì piào, zhǎo háng kōng gōng sī.", vi: "Có thể đổi vé hoặc hoàn vé, tìm hãng hàng không." },
      { zh: "酒店没有我的预订。", pinyin: "jiǔ diàn méi yǒu wǒ de yù dìng.", vi: "Khách sạn không có đặt chỗ của tôi." },
      { zh: "请出示预订确认，我们帮您查。", pinyin: "qǐng chū shì yù dìng què rèn, wǒ men bāng nín chá.", vi: "Xin xuất trình xác nhận đặt phòng, chúng tôi giúp kiểm tra." },
      { zh: "行李没到。", pinyin: "xíng li méi dào.", vi: "Hành lý chưa đến." },
      { zh: "去行李服务柜台登记。", pinyin: "qù xíng li fú wù guì tái dēng jì.", vi: "Đến quầy dịch vụ hành lý đăng ký." },
      { zh: "能帮我联系导游吗？", pinyin: "néng bāng wǒ lián xì dǎo yóu ma?", vi: "Có thể giúp tôi liên hệ hướng dẫn viên không?" },
      { zh: "可以，稍等。", pinyin: "kě yǐ, shāo děng.", vi: "Được, đợi một chút." },
      { zh: "谢谢您的帮助。", pinyin: "xiè xie nín de bāng zhù.", vi: "Cảm ơn sự giúp đỡ của anh/chị." },
      { zh: "不客气，一路平安。", pinyin: "bú kè qi, yī lù píng ān.", vi: "Không có gì, thượng lộ bình an." },

      // 10. Phản xạ tình huống tổng hợp
      { zh: "你打算去哪里旅游？我想去云南，玩五天。", pinyin: "nǐ dǎ suàn qù nǎ lǐ lǚ yóu? wǒ xiǎng qù Yún nán, wán wǔ tiān.", vi: "Bạn định đi du lịch đâu? Tôi muốn đi Vân Nam, chơi năm ngày." },
      { zh: "机票订好了吗？还没有，正在看价格。", pinyin: "jī piào dìng hǎo le ma? hái méi yǒu, zhèng zài kàn jià gé.", vi: "Vé máy bay đặt xong chưa? Chưa, đang xem giá." },
      { zh: "请问登机口在哪里？在十二号登机口。", pinyin: "qǐng wèn dēng jī kǒu zài nǎ lǐ? zài shí èr hào dēng jī kǒu.", vi: "Xin hỏi cửa lên máy bay ở đâu? Ở cửa số 12." },
      { zh: "我预订了房间。请问您的姓名？", pinyin: "wǒ yù dìng le fáng jiān. qǐng wèn nín de xìng míng?", vi: "Tôi đã đặt phòng. Xin hỏi họ tên anh/chị?" },
      { zh: "房间在八楼，这是房卡。早餐七点到九点半。", pinyin: "fáng jiān zài bā lóu, zhè shì fáng kǎ. zǎo cān qī diǎn dào jiǔ diǎn bàn.", vi: "Phòng ở tầng tám, đây là thẻ phòng. Bữa sáng bảy giờ đến chín rưỡi." },
      { zh: "请问地铁站怎么走？往前走大约五百米。", pinyin: "qǐng wèn dì tiě zhàn zěn me zǒu? wǎng qián zǒu dà yuē wǔ bǎi mǐ.", vi: "Xin hỏi ga tàu điện ngầm đi thế nào? Đi thẳng khoảng năm trăm mét." },
      { zh: "门票多少钱？成人一百二十，学生半价。", pinyin: "mén piào duō shao qián? chéng rén yī bǎi èr shí, xué sheng bàn jià.", vi: "Vé vào cửa bao nhiêu? Người lớn một trăm hai mươi, học sinh nửa giá." },
      { zh: "可以拍照吗？可以，但不要用闪光灯。", pinyin: "kě yǐ pāi zhào ma? kě yǐ, dàn bú yào yòng shǎn guāng dēng.", vi: "Chụp ảnh được không? Được, nhưng đừng dùng flash." },
      { zh: "附近有什么好吃的？本地特色是过桥米线。", pinyin: "fù jìn yǒu shén me hǎo chī de? běn dì tè sè shì guò qiáo mǐ xiàn.", vi: "Gần đây có gì ngon? Đặc sản địa phương là miến qua cầu." },
      { zh: "有没有特色纪念品？有手工银器和茶叶。", pinyin: "yǒu méi yǒu tè sè jì niàn pǐn? yǒu shǒu gōng yín qì hé chá yè.", vi: "Có quà lưu niệm đặc sắc không? Có đồ bạc thủ công và trà." },
      { zh: "明天天气怎么样？多云，有点凉，最好带伞。", pinyin: "míng tiān tiān qì zěn me yàng? duō yún, yǒu diǎn liáng, zuì hǎo dài sǎn.", vi: "Ngày mai thời tiết thế nào? Nhiều mây, hơi mát, tốt nhất mang ô." },
      { zh: "我的护照丢了。先报警，再联系使馆。", pinyin: "wǒ de hù zhào diū le. xiān bào jǐng, zài lián xì shǐ guǎn.", vi: "Hộ chiếu của tôi mất rồi. Báo cảnh sát trước, rồi liên hệ đại sứ quán." },
      { zh: "我迷路了。您在哪个路口？我帮您看。", pinyin: "wǒ mí lù le. nín zài nǎ ge lù kǒu? wǒ bāng nín kàn.", vi: "Tôi lạc đường rồi. Anh/chị đang ở ngã tư nào? Tôi giúp xem." },
      { zh: "航班取消了怎么办？可以改签或退票。", pinyin: "háng bān qǔ xiāo le zěn me bàn? kě yǐ gǎi qiān huò tuì piào.", vi: "Chuyến bay bị hủy thì làm sao? Có thể đổi vé hoặc hoàn vé." },
      { zh: "风景真漂亮，值得一来。", pinyin: "fēng jǐng zhēn piào liang, zhí de yī lái.", vi: "Phong cảnh thật đẹp, đáng đến một lần." },
      { zh: "可以延迟退房吗？最晚两点，需要提前说。", pinyin: "kě yǐ yán chí tuì fáng ma? zuì wǎn liǎng diǎn, xū yào tí qián shuō.", vi: "Trả phòng muộn được không? Muộn nhất hai giờ, cần nói trước." },
      { zh: "谢谢您的帮助。不客气，一路平安。", pinyin: "xiè xie nín de bāng zhù. bú kè qi, yī lù píng ān.", vi: "Cảm ơn sự giúp đỡ. Không có gì, thượng lộ bình an." },
      { zh: "这次旅行很愉快，下次还想再来。", pinyin: "zhè cì lǚ xíng hěn yú kuài, xià cì hái xiǎng zài lái.", vi: "Chuyến đi này rất vui, lần sau còn muốn đến nữa." },
      { zh: "欢迎再来，祝您旅途愉快！", pinyin: "huān yíng zài lái, zhù nín lǚ tú yú kuài!", vi: "Chào mừng đến nữa, chúc anh/chị hành trình vui vẻ!" },
      { zh: "好的，再见！", pinyin: "hǎo de, zài jiàn!", vi: "Được, tạm biệt!" }
    ]
  },

      { zh: "红烧肉很受欢迎，可以少辣。", pinyin: "hóng shāo ròu hěn shòu huān yíng, kě yǐ shǎo là.", vi: "Thịt kho rất được ưa chuộng, có thể ít cay." },
      { zh: "这个菜会不会太辣一点呢？", pinyin: "zhè ge cài huì bu huì tài là yī diǎn? ne", vi: "Món này có quá cay một chút không?" },
      { zh: "有一点辣，可以帮您少放呢。", pinyin: "yǒu yī diǎn là, kě yǐ bāng nín shǎo fàng. ne", vi: "Hơi cay, có thể giúp anh/chị ít bỏ." },
      { zh: "有素食吗？我不太吃肉的话。", pinyin: "yǒu sù shí ma? wǒ bú tài chī ròu. de huà", vi: "Có đồ chay không? Tôi không ăn thịt nhiều." },
      { zh: "有，菜单上绿色标记的是素的。", pinyin: "yǒu, cài dān shàng lǜ sè biāo jì de shì sù de.", vi: "Có, trên thực đơn đánh dấu xanh là chay." },
      { zh: "菜来了，请慢用，味道如何呢？", pinyin: "cài lái le, qǐng màn yòng, wèi dào rú hé? ne", vi: "Món đến rồi, xin dùng từ từ, hương vị thế nào?" },
      { zh: "很好吃，再来一碗米饭的话。", pinyin: "hěn hǎo chī, zài lái yī wǎn mǐ fàn. de huà", vi: "Rất ngon, thêm một bát cơm." },
      { zh: "可以打包吗？请分开装好呢。", pinyin: "kě yǐ dǎ bāo ma? qǐng fēn kāi zhuāng hǎo. ne", vi: "Có thể mang về không? Xin đóng riêng xong." },
      { zh: "想喝点什么？来两杯冰可乐。", pinyin: "xiǎng hē diǎn shén me? lái liǎng bēi bīng kě lè.", vi: "Muốn uống gì? Lấy hai cốc cola lạnh." },
      { zh: "买单，一共多少？可以微信吗？", pinyin: "mǎi dān, yī gòng duō shao? kě yǐ Wēi xìn ma?", vi: "Tính tiền, tổng cộng bao nhiêu? WeChat được không?" },
      { zh: "一百二十八，可以，请扫码呢。", pinyin: "yī bǎi èr shí bā, kě yǐ, qǐng sǎo mǎ. ne", vi: "Một trăm hai mươi tám, được, xin quét mã." },
      { zh: "需要开发票吗？写公司名称。", pinyin: "xū yào kāi fā piào ma? xiě gōng sī míng chēng.", vi: "Cần xuất hóa đơn không? Viết tên công ty." },
      { zh: "这道菜有问题，里面有头发。", pinyin: "zhè dào cài yǒu wèn tí, lǐ miàn yǒu tóu fa.", vi: "Món này có vấn đề, bên trong có tóc." },
      { zh: "非常抱歉，马上换，这道不收费。", pinyin: "fēi cháng bào qiàn, mǎ shàng huàn, zhè dào bù shōu fèi.", vi: "Rất xin lỗi, đổi ngay, món này không tính tiền." },
      { zh: "味道不错，会推荐朋友过来。", pinyin: "wèi dào bù cuò, huì tuī jiàn péng you guò lái.", vi: "Hương vị ổn, sẽ giới thiệu bạn bè đến." },
      { zh: "欢迎下次再来，请慢走的话。", pinyin: "huān yíng xià cì zài lái, qǐng màn zǒu. de huà", vi: "Chào mừng lần sau đến nữa, xin đi cẩn thận." },
      { zh: "谢谢，再见，祝您工作顺利呢。", pinyin: "xiè xie, zài jiàn, zhù nín gōng zuò shùn lì. ne", vi: "Cảm ơn, tạm biệt, chúc anh/chị công việc suôn sẻ." }
    ]
  },
  "PHONG_VAN-1": {
    title: "💼 Phỏng vấn xin việc · Phần 1",
    color: "#0d47a1",
    sections: [
      { name: "Chào hỏi & tự giới thiệu", start: 0 },
      { name: "Học vấn & kinh nghiệm", start: 20 },

    ],
    sentences: [
      // 1. Chào hỏi & tự giới thiệu
      { zh: "您好，我是来面试的。", pinyin: "nín hǎo, wǒ shì lái miàn shì de.", vi: "Xin chào, tôi đến phỏng vấn." },
      { zh: "请坐，欢迎您。", pinyin: "qǐng zuò, huān yíng nín.", vi: "Mời ngồi, chào mừng anh/chị." },
      { zh: "请先做一下自我介绍。", pinyin: "qǐng xiān zuò yī xià zì wǒ jiè shào.", vi: "Xin trước hết tự giới thiệu một chút." },
      { zh: "好的，我叫……，来自越南。", pinyin: "hǎo de, wǒ jiào……, lái zì Yuè nán.", vi: "Được, tôi tên……, đến từ Việt Nam." },
      { zh: "我有三年相关工作经验。", pinyin: "wǒ yǒu sān nián xiāng guān gōng zuò jīng yàn.", vi: "Tôi có ba năm kinh nghiệm làm việc liên quan." },
      { zh: "很高兴有机会来贵公司面试。", pinyin: "hěn gāo xìng yǒu jī huì lái guì gōng sī miàn shì.", vi: "Rất vui có cơ hội đến công ty quý vị phỏng vấn." },
      { zh: "请简单介绍一下您自己。", pinyin: "qǐng jiǎn dān jiè shào yī xià nín zì jǐ.", vi: "Xin giới thiệu ngắn gọn về bản thân anh/chị." },
      { zh: "我性格开朗，做事认真负责。", pinyin: "wǒ xìng gé kāi lǎng, zuò shì rèn zhēn fù zé.", vi: "Tôi tính cách cởi mở, làm việc nghiêm túc có trách nhiệm." },
      { zh: "您怎么知道我们公司的？", pinyin: "nín zěn me zhī dào wǒ men gōng sī de?", vi: "Anh/chị biết công ty chúng tôi bằng cách nào?" },
      { zh: "通过招聘网站看到的。", pinyin: "tōng guò zhāo pìn wǎng zhàn kàn dào de.", vi: "Thấy qua website tuyển dụng." },
      { zh: "朋友推荐我来应聘。", pinyin: "péng you tuī jiàn wǒ lái yìng pìn.", vi: "Bạn bè giới thiệu tôi đến ứng tuyển." },
      { zh: "今天面试的是什么岗位？", pinyin: "jīn tiān miàn shì de shì shén me gǎng wèi?", vi: "Hôm nay phỏng vấn vị trí gì?" },
      { zh: "自动化技术员岗位。", pinyin: "zì dòng huà jì shù yuán gǎng wèi.", vi: "Vị trí kỹ thuật viên tự động hóa." },
      { zh: "请稍等，面试官马上到。", pinyin: "qǐng shāo děng, miàn shì guān mǎ shàng dào.", vi: "Xin đợi một chút, người phỏng vấn sắp đến." },
      { zh: "好的，谢谢。", pinyin: "hǎo de, xiè xie.", vi: "Được, cảm ơn." },
      { zh: "请把简历给我看一下。", pinyin: "qǐng bǎ jiǎn lì gěi wǒ kàn yī xià.", vi: "Xin đưa hồ sơ cho tôi xem một chút." },
      { zh: "这是我的简历，请过目。", pinyin: "zhè shì wǒ de jiǎn lì, qǐng guò mù.", vi: "Đây là hồ sơ của tôi, xin xem qua." },
      { zh: "您的中文说得不错。", pinyin: "nín de Zhōng wén shuō de bù cuò.", vi: "Tiếng Trung của anh/chị nói ổn đấy." },
      { zh: "谢谢，还在继续学习。", pinyin: "xiè xie, hái zài jì xù xué xí.", vi: "Cảm ơn, vẫn đang tiếp tục học." },
      { zh: "请放松，不用紧张。", pinyin: "qǐng fàng sōng, bú yòng jǐn zhāng.", vi: "Xin thư giãn, không cần căng thẳng." },

      // 2. Học vấn & kinh nghiệm
      { zh: "您的学历是什么？", pinyin: "nín de xué lì shì shén me?", vi: "Học vấn của anh/chị là gì?" },
      { zh: "我是大学本科毕业。", pinyin: "wǒ shì dà xué běn kē bì yè.", vi: "Tôi tốt nghiệp đại học hệ chính quy." },
      { zh: "您学的是什么专业？", pinyin: "nín xué de shì shén me zhuān yè?", vi: "Anh/chị học chuyên ngành gì?" },
      { zh: "我学的是自动化专业。", pinyin: "wǒ xué de shì zì dòng huà zhuān yè.", vi: "Tôi học chuyên ngành tự động hóa." },
      { zh: "您以前在哪家公司工作？", pinyin: "nín yǐ qián zài nǎ jiā gōng sī gōng zuò?", vi: "Trước đây anh/chị làm ở công ty nào?" },
      { zh: "我在一家制造公司工作了三年。", pinyin: "wǒ zài yī jiā zhì zào gōng sī gōng zuò le sān nián.", vi: "Tôi làm ở một công ty sản xuất ba năm." },
      { zh: "主要负责什么工作？", pinyin: "zhǔ yào fù zé shén me gōng zuò?", vi: "Chủ yếu phụ trách công việc gì?" },
      { zh: "负责设备维护和故障处理。", pinyin: "fù zé shè bèi wéi hù hé gù zhàng chǔ lǐ.", vi: "Phụ trách bảo trì thiết bị và xử lý sự cố." },
      { zh: "为什么离开上一家公司？", pinyin: "wèi shén me lí kāi shàng yī jiā gōng sī?", vi: "Tại sao rời công ty trước?" },
      { zh: "想寻找更大的发展空间。", pinyin: "xiǎng xún zhǎo gèng dà de fā zhǎn kōng jiān.", vi: "Muốn tìm không gian phát triển lớn hơn." },
      { zh: "您有相关证书吗？", pinyin: "nín yǒu xiāng guān zhèng shū ma?", vi: "Anh/chị có chứng chỉ liên quan không?" },
      { zh: "有电工证和PLC相关证书。", pinyin: "yǒu diàn gōng zhèng hé PLC xiāng guān zhèng shū.", vi: "Có chứng chỉ điện và chứng chỉ liên quan PLC." },
      { zh: "实习经历能介绍一下吗？", pinyin: "shí xí jīng lì néng jiè shào yī xià ma?", vi: "Kinh nghiệm thực tập có thể giới thiệu một chút không?" },
      { zh: "在校期间在工厂实习过半年。", pinyin: "zài xiào qī jiān zài gōng chǎng shí xí guò bàn nián.", vi: "Trong thời gian học đã thực tập ở nhà máy nửa năm." },
      { zh: "您做过最有挑战的项目是什么？", pinyin: "nín zuò guò zuì yǒu tiǎo zhàn de xiàng mù shì shén me?", vi: "Dự án đầy thách thức nhất anh/chị từng làm là gì?" },
      { zh: "独立完成一条生产线的调试。", pinyin: "dú lì wán chéng yī tiáo shēng chǎn xiàn de tiáo shì.", vi: "Độc lập hoàn thành chạy thử một dây chuyền sản xuất." },
      { zh: "工作中有没有被表扬过？", pinyin: "gōng zuò zhōng yǒu méi yǒu bèi biǎo yáng guò?", vi: "Trong công việc đã từng được khen chưa?" },
      { zh: "有，因为解决了一个重大故障。", pinyin: "yǒu, yīn wèi jiě jué le yī gè zhòng dà gù zhàng.", vi: "Có, vì giải quyết được một sự cố lớn." },
      { zh: "您对加班怎么看？", pinyin: "nín duì jiā bān zěn me kàn?", vi: "Anh/chị nhìn nhận tăng ca thế nào?" },
      { zh: "如果工作需要，我可以接受。", pinyin: "rú guǒ gōng zuò xū yào, wǒ kě yǐ jiē shòu.", vi: "Nếu công việc cần, tôi có thể chấp nhận." },

      // 3. Kỹ năng & chuyên môn
      { zh: "您会操作哪些设备？", pinyin: "nín huì cāo zuò nǎ xiē shè bèi?", vi: "Anh/chị biết vận hành những thiết bị nào?" },
      { zh: "会操作PLC、伺服和变频器。", pinyin: "huì cāo zuò PLC, shì fú hé biàn pín qì.", vi: "Biết vận hành PLC, servo và biến tần." },
      { zh: "您熟悉哪些编程软件？", pinyin: "nín shóu xī nǎ xiē biān chéng ruǎn jiàn?", vi: "Anh/chị quen thuộc phần mềm lập trình nào?" },
      { zh: "熟悉西门子和三菱的编程软件。", pinyin: "shóu xī Xī mén zǐ hé Sān líng de biān chéng ruǎn jiàn.", vi: "Quen phần mềm lập trình Siemens và Mitsubishi." },
      { zh: "有没有独立调试过设备？", pinyin: "yǒu méi yǒu dú lì tiáo shì guò shè bèi?", vi: "Đã từng độc lập chạy thử thiết bị chưa?" },
      { zh: "有，多次独立完成调试工作。", pinyin: "yǒu, duō cì dú lì wán chéng tiáo shì gōng zuò.", vi: "Có, nhiều lần độc lập hoàn thành công việc chạy thử." },
      { zh: "您的中文水平怎么样？", pinyin: "nín de Zhōng wén shuǐ píng zěn me yàng?", vi: "Trình độ tiếng Trung của anh/chị thế nào?" },
      { zh: "能进行日常和工作交流。", pinyin: "néng jìn xíng rì cháng hé gōng zuò jiāo liú.", vi: "Có thể giao tiếp hàng ngày và trong công việc." },
      { zh: "会看图纸吗？", pinyin: "huì kàn tú zhǐ ma?", vi: "Có biết đọc bản vẽ không?" },
      { zh: "会，电气图和机械图都能看。", pinyin: "huì, diàn qì tú hé jī xiè tú dōu néng kàn.", vi: "Có, bản vẽ điện và cơ đều đọc được." },
      { zh: "遇到不会的问题怎么办？", pinyin: "yù dào bú huì de wèn tí zěn me bàn?", vi: "Gặp vấn đề không biết thì làm sao?" },
      { zh: "先自己查资料，再请教同事或领导。", pinyin: "xiān zì jǐ chá zī liào, zài qǐng jiào tóng shì huò lǐng dǎo.", vi: "Trước tự tra tài liệu, rồi hỏi đồng nghiệp hoặc lãnh đạo." },
      { zh: "您学习新技术的能力怎么样？", pinyin: "nín xué xí xīn jì shù de néng lì zěn me yàng?", vi: "Khả năng học công nghệ mới của anh/chị thế nào?" },
      { zh: "学习能力较强，能快速上手。", pinyin: "xué xí néng lì jiào qiáng, néng kuài sù shàng shǒu.", vi: "Khả năng học khá mạnh, có thể nắm nhanh." },
      { zh: "会使用办公软件吗？", pinyin: "huì shǐ yòng bàn gōng ruǎn jiàn ma?", vi: "Có biết dùng phần mềm văn phòng không?" },
      { zh: "会，Word、Excel都能熟练使用。", pinyin: "huì, Word, Excel dōu néng shóu liàn shǐ yòng.", vi: "Có, Word, Excel đều dùng thành thạo." },
      { zh: "有没有带过新人？", pinyin: "yǒu méi yǒu dài guò xīn rén?", vi: "Đã từng kèm người mới chưa?" },
      { zh: "有，带过两名新同事。", pinyin: "yǒu, dài guò liǎng míng xīn tóng shì.", vi: "Có, đã kèm hai đồng nghiệp mới." },
      { zh: "您对安全操作怎么看？", pinyin: "nín duì ān quán cāo zuò zěn me kàn?", vi: "Anh/chị nhìn nhận thao tác an toàn thế nào?" },
      { zh: "安全第一，必须严格遵守规定。", pinyin: "ān quán dì yī, bì xū yán gé zūn shǒu guī dìng.", vi: "An toàn là trên hết, phải nghiêm túc tuân thủ quy định." },

      // 4. Lý do ứng tuyển
      { zh: "您为什么想加入我们公司？", pinyin: "nín wèi shén me xiǎng jiā rù wǒ men gōng sī?", vi: "Tại sao anh/chị muốn gia nhập công ty chúng tôi?" },
      { zh: "贵公司发展前景好，我想在这里成长。", pinyin: "guì gōng sī fā zhǎn qián jǐng hǎo, wǒ xiǎng zài zhè lǐ chéng zhǎng.", vi: "Công ty quý vị triển vọng phát triển tốt, tôi muốn trưởng thành ở đây." },
      { zh: "您对我们公司了解多少？", pinyin: "nín duì wǒ men gōng sī liǎo jiě duō shao?", vi: "Anh/chị hiểu công ty chúng tôi được bao nhiêu?" },
      { zh: "了解贵公司是自动化行业的领先企业。", pinyin: "liǎo jiě guì gōng sī shì zì dòng huà háng yè de lǐng xiān qǐ yè.", vi: "Hiểu công ty quý vị là doanh nghiệp hàng đầu ngành tự động hóa." },
      { zh: "这个岗位吸引您的地方是什么？", pinyin: "zhè ge gǎng wèi xī yǐn nín de dì fang shì shén me?", vi: "Điểm thu hút anh/chị ở vị trí này là gì?" },
      { zh: "能发挥我的专业，也有学习空间。", pinyin: "néng fā huī wǒ de zhuān yè, yě yǒu xué xí kōng jiān.", vi: "Có thể phát huy chuyên môn, cũng có không gian học hỏi." },
      { zh: "您希望在这里得到什么？", pinyin: "nín xī wàng zài zhè lǐ dé dào shén me?", vi: "Anh/chị hy vọng nhận được gì ở đây?" },
      { zh: "希望提升技术，积累更多经验。", pinyin: "xī wàng tí shēng jì shù, jī lěi gèng duō jīng yàn.", vi: "Hy vọng nâng cao kỹ thuật, tích lũy nhiều kinh nghiệm hơn." },
      { zh: "如果有其他更好的机会呢？", pinyin: "rú guǒ yǒu qí tā gèng hǎo de jī huì ne?", vi: "Nếu có cơ hội khác tốt hơn thì sao?" },

      { zh: "遇到技术难题卡住了怎么办？", pinyin: "yù dào jì shù nán tí kǎ zhù le zěn me bàn?", vi: "Gặp khó khăn kỹ thuật bị kẹt thì làm sao?" },
      { zh: "查资料、请教同事，必要时请外部支持。", pinyin: "chá zī liào, qǐng jiào tóng shì, bì yào shí qǐng wài bù zhī chí.", vi: "Tra tài liệu, hỏi đồng nghiệp, cần thiết thì xin hỗ trợ bên ngoài." },
      { zh: "如何保证工作质量？", pinyin: "rú hé bǎo zhèng gōng zuò zhì liàng?", vi: "Làm sao đảm bảo chất lượng công việc?" },
      { zh: "按标准操作，自检后再交付。", pinyin: "àn biāo zhǔn cāo zuò, zì jiǎn hòu zài jiāo fù.", vi: "Thao tác theo tiêu chuẩn, tự kiểm rồi mới bàn giao." },
      { zh: "您能接受经常出差吗？", pinyin: "nín néng jiē shòu jīng cháng chū chāi ma?", vi: "Anh/chị có thể chấp nhận thường xuyên đi công tác không?" },
      { zh: "可以，根据工作需要安排。", pinyin: "kě yǐ, gēn jù gōng zuò xū yào ān pái.", vi: "Được, sắp xếp theo nhu cầu công việc." },

      // 9. Kết thúc phỏng vấn
      { zh: "今天的面试就到这里。", pinyin: "jīn tiān de miàn shì jiù dào zhè lǐ.", vi: "Phỏng vấn hôm nay đến đây." },
      { zh: "谢谢您抽出时间。", pinyin: "xiè xie nín chōu chū shí jiān.", vi: "Cảm ơn anh/chị đã dành thời gian." },
      { zh: "我们会在一周内通知结果。", pinyin: "wǒ men huì zài yī zhōu nèi tōng zhī jié guǒ.", vi: "Chúng tôi sẽ thông báo kết quả trong một tuần." },
      { zh: "好的，我期待您的消息。", pinyin: "hǎo de, wǒ qī dài nín de xiāo xi.", vi: "Được, tôi mong tin từ anh/chị." },
      { zh: "您还有什么要补充的吗？", pinyin: "nín hái yǒu shén me yào bǔ chōng de ma?", vi: "Anh/chị còn gì muốn bổ sung không?" },
      { zh: "没有了，谢谢。", pinyin: "méi yǒu le, xiè xie.", vi: "Không còn, cảm ơn." },
      { zh: "请问大概什么时候能知道结果？", pinyin: "qǐng wèn dà gài shén me shí hou néng zhī dào jié guǒ?", vi: "Xin hỏi khoảng khi nào biết kết quả?" },
      { zh: "最快三到五个工作日。", pinyin: "zuì kuài sān dào wǔ gè gōng zuò rì.", vi: "Nhanh nhất ba đến năm ngày làm việc." },
      { zh: "如果有消息，我们会电话或邮件通知。", pinyin: "rú guǒ yǒu xiāo xi, wǒ men huì diàn huà huò yóu jiàn tōng zhī.", vi: "Nếu có tin, chúng tôi sẽ gọi hoặc email thông báo." },
      { zh: "好的，我会保持电话畅通。", pinyin: "hǎo de, wǒ huì bǎo chí diàn huà chàng tōng.", vi: "Được, tôi sẽ giữ điện thoại thông suốt." },
      { zh: "祝您今天顺利。", pinyin: "zhù nín jīn tiān shùn lì.", vi: "Chúc anh/chị hôm nay suôn sẻ." },
      { zh: "也祝您工作顺利。", pinyin: "yě zhù nín gōng zuò shùn lì.", vi: "Cũng chúc anh/chị công việc suôn sẻ." },
      { zh: "请慢走。", pinyin: "qǐng màn zǒu.", vi: "Xin đi cẩn thận." },
      { zh: "谢谢，再见。", pinyin: "xiè xie, zài jiàn.", vi: "Cảm ơn, tạm biệt." },
      { zh: "很高兴认识您。", pinyin: "hěn gāo xìng rèn shi nín.", vi: "Rất vui được làm quen với anh/chị." },
      { zh: "同样高兴。", pinyin: "tóng yàng gāo xìng.", vi: "Cũng vui như vậy." },
      { zh: "希望有机会合作。", pinyin: "xī wàng yǒu jī huì hé zuò.", vi: "Hy vọng có cơ hội hợp tác." },
      { zh: "我们也希望如此。", pinyin: "wǒ men yě xī wàng rú cǐ.", vi: "Chúng tôi cũng hy vọng như vậy." },
      { zh: "再次感谢您的时间。", pinyin: "zài cì gǎn xiè nín de shí jiān.", vi: "Một lần nữa cảm ơn thời gian của anh/chị." },
      { zh: "不客气，路上小心。", pinyin: "bú kè qi, lù shàng xiǎo xīn.", vi: "Không có gì, đi đường cẩn thận." },

      // 10. Phản xạ tình huống tổng hợp
      { zh: "您好，我是来面试自动化技术员岗位的。", pinyin: "nín hǎo, wǒ shì lái miàn shì zì dòng huà jì shù yuán gǎng wèi de.", vi: "Xin chào, tôi đến phỏng vấn vị trí kỹ thuật viên tự động hóa." },
      { zh: "请先做自我介绍。好的，我叫……，有三年相关经验。", pinyin: "qǐng xiān zuò zì wǒ jiè shào. hǎo de, wǒ jiào……, yǒu sān nián xiāng guān jīng yàn.", vi: "Xin trước hết tự giới thiệu. Được, tôi tên……, có ba năm kinh nghiệm liên quan." },
      { zh: "您为什么想加入我们公司？", pinyin: "nín wèi shén me xiǎng jiā rù wǒ men gōng sī?", vi: "Tại sao anh/chị muốn gia nhập công ty chúng tôi?" },
      { zh: "贵公司发展前景好，我想在这里成长。", pinyin: "guì gōng sī fā zhǎn qián jǐng hǎo, wǒ xiǎng zài zhè lǐ chéng zhǎng.", vi: "Công ty quý vị triển vọng tốt, tôi muốn trưởng thành ở đây." },
      { zh: "请谈谈您的优点和缺点。", pinyin: "qǐng tán tan nín de yōu diǎn hé quē diǎn.", vi: "Xin nói về ưu điểm và khuyết điểm của anh/chị." },
      { zh: "优点是认真负责；缺点是有时过于追求完美。", pinyin: "yōu diǎn shì rèn zhēn fù zé; quē diǎn shì yǒu shí guò yú zhuī qiú wán měi.", vi: "Ưu điểm là nghiêm túc có trách nhiệm; khuyết điểm là đôi khi quá cầu toàn." },
      { zh: "您期望的薪资是多少？", pinyin: "nín qī wàng de xīn zī shì duō shao?", vi: "Mức lương anh/chị kỳ vọng là bao nhiêu?" },
      { zh: "根据经验和市场，希望在合理范围内协商。", pinyin: "gēn jù jīng yàn hé shì chǎng, xī wàng zài hé lǐ fàn wéi nèi xié shāng.", vi: "Theo kinh nghiệm và thị trường, hy vọng thương lượng trong phạm vi hợp lý." },
      { zh: "如果设备突然故障，您会怎么做？", pinyin: "rú guǒ shè bèi tū rán gù zhàng, nín huì zěn me zuò?", vi: "Nếu thiết bị đột ngột sự cố, anh/chị sẽ làm gì?" },
      { zh: "先确保安全，再排查原因并及时报告。", pinyin: "xiān què bǎo ān quán, zài pái chá yuán yīn bìng jí shí bào gào.", vi: "Trước đảm bảo an toàn, rồi kiểm tra nguyên nhân và báo cáo kịp thời." },
      { zh: "请问这个岗位的主要职责是什么？", pinyin: "qǐng wèn zhè ge gǎng wèi de zhǔ yào zhí zé shì shén me?", vi: "Xin hỏi trách nhiệm chính của vị trí này là gì?" },
      { zh: "负责设备调试、维护和故障处理。", pinyin: "fù zé shè bèi tiáo shì, wéi hù hé gù zhàng chǔ lǐ.", vi: "Phụ trách chạy thử, bảo trì thiết bị và xử lý sự cố." },
      { zh: "您什么时候可以入职？", pinyin: "nín shén me shí hou kě yǐ rù zhí?", vi: "Anh/chị khi nào có thể nhận việc?" },
      { zh: "如果录用，一个月内可以入职。", pinyin: "rú guǒ lù yòng, yī gè yuè nèi kě yǐ rù zhí.", vi: "Nếu được nhận, trong một tháng có thể nhận việc." },
      { zh: "我们会在一周内通知结果。", pinyin: "wǒ men huì zài yī zhōu nèi tōng zhī jié guǒ.", vi: "Chúng tôi sẽ thông báo kết quả trong một tuần." },
      { zh: "好的，我期待您的消息，谢谢。", pinyin: "hǎo de, wǒ qī dài nín de xiāo xi, xiè xie.", vi: "Được, tôi mong tin từ anh/chị, cảm ơn." },
      { zh: "压力大的时候，我先冷静分析再解决。", pinyin: "yā lì dà de shí hou, wǒ xiān lěng jìng fēn xī zài jiě jué.", vi: "Khi áp lực lớn, tôi trước bình tĩnh phân tích rồi giải quyết." },
      { zh: "我学习能力较强，能快速掌握新技术。", pinyin: "wǒ xué xí néng lì jiào qiáng, néng kuài sù zhǎng wò xīn jì shù.", vi: "Khả năng học của tôi khá mạnh, có thể nắm nhanh công nghệ mới." },
      { zh: "很高兴有机会面试，谢谢您的时间。", pinyin: "hěn gāo xìng yǒu jī huì miàn shì, xiè xie nín de shí jiān.", vi: "Rất vui có cơ hội phỏng vấn, cảm ơn thời gian của anh/chị." },
      { zh: "再见，祝您工作顺利，希望有机会合作。", pinyin: "zài jiàn, zhù nín gōng zuò shùn lì, xī wàng yǒu jī huì hé zuò.", vi: "Tạm biệt, chúc anh/chị công việc suôn sẻ, hy vọng có cơ hội hợp tác." }
